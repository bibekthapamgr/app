[versions]
# Android SDK levels (ADR-0007; minSdk = owner decision D3, Android 10)
compileSdk = "36"
targetSdk = "36"
minSdk = "29"

agp = "9.5.0"
kotlin = "2.4.21"
composeBom = "2025.10.00"
activityCompose = "1.13.0"
coreKtx = "1.17.0"
lifecycle = "2.10.0"
navigation = "2.9.8"
datastore = "1.1.7"
room = "2.8.5"
ksp = "2.3.13"
kotlinxCoroutines = "1.10.2"
