# Gradle
org.gradle.jvmargs=-Xmx3g -Dfile.encoding=UTF-8
org.gradle.caching=true
org.gradle.parallel=true

# Android
android.useAndroidX=true
android.nonTransitiveRClass=true

# Kotlin
kotlin.code.style=official

# Provisional application ID (M2 task 2). Replace before release (M11) with an
# ID based on a domain the owner controls, here or per build with
#   ./gradlew assembleRelease -Pproxyflow.applicationId=com.example.yourapp
# The code namespace (app.proxyflow) does not change when this does.
proxyflow.applicationId=app.proxyflow.android
