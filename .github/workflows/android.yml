name: android

# M2 app checks: secrets scan, formatting (ktlint), Android Lint, JVM and
# Robolectric tests, debug and release builds, screenshots of every screen.
# Third-party actions are pinned to commit SHAs (tag in the comment) so a
# moved tag cannot change what runs. Each Gradle step runs even when an
# earlier one failed, so one run reports every problem at once.

on:
  push:
    branches: [main]
    paths-ignore: ["spike/**", "docs/**", "**/*.md"]
  pull_request:
    paths-ignore: ["spike/**", "docs/**", "**/*.md"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: No secrets or signing files in the repository
        run: scripts/check-secrets.sh

      - name: Design tokens and generated colours agree
        run: |
          python3 design/tools/check_contrast.py
          python3 design/tools/generate_compose_colors.py
          git diff --exit-code -- core/designsystem/src/main/kotlin/app/proxyflow/core/designsystem/theme/Color.kt

      - uses: gradle/actions/wrapper-validation@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1

      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: "21"

      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1

      - name: Formatting (ktlint via Spotless)
        if: ${{ !cancelled() }}
        run: ./gradlew spotlessCheck

      - name: Android Lint (app and every module it uses)
        if: ${{ !cancelled() }}
        run: ./gradlew :app:lintDebug

      - name: Unit, ViewModel and Robolectric UI tests
        if: ${{ !cancelled() }}
        run: ./gradlew testDebugUnitTest

      - name: Debug build
        if: ${{ !cancelled() }}
        run: ./gradlew :app:assembleDebug

      - name: Release build (R8, unsigned unless signing secrets are configured)
        if: ${{ !cancelled() }}
        run: ./gradlew :app:assembleRelease

      - name: Screenshots of every screen, light and dark (Roborazzi)
        if: ${{ !cancelled() }}
        run: ./gradlew :app:recordRoborazziDebug

      - name: Upload reports, screenshots and APKs
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: android-reports
          path: |
            **/build/reports/
            **/build/test-results/
            app/screenshots/
            app/build/outputs/apk/
          if-no-files-found: warn
