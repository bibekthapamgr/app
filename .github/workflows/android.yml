name: android

# App checks: the Go packet engine (engine job: tests with the race detector,
# fuzzing, and the gomobile AAR the Android modules use, built after a
# vulnerability scan of everything it links), formatting (ktlint), Android Lint, JVM and Robolectric tests, the
# committed Room schema, debug and release builds, the release manifest,
# screenshots of every screen compared with the committed ones, and (device
# job) the Android Keystore, storage and engine tests on emulators. The secrets scan
# has its own workflow (secrets.yml), which runs on every push whatever changed.
# Third-party actions are pinned to commit SHAs (tag in the comment) so a
# moved tag cannot change what runs. Each Gradle step runs even when an
# earlier one failed, so one run reports every problem at once; none runs
# unless the Gradle wrapper passed validation.

on:
  push:
    branches: [main]
    paths-ignore: ["spike/**", "docs/**", "**/*.md"]
  pull_request:
    paths-ignore: ["spike/**", "docs/**", "**/*.md"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # The packet engine (engine/, ADR-0001..0005). go.sum is checked against the
  # checksum database; the tests run the adapters against mock SOCKS5 and HTTP
  # CONNECT proxies (sign-in, TLS with a test PKI, timeouts, cancellation),
  # the netstack through them, and check that nothing leaks (goroutines,
  # descriptors) or prints a credential. The AAR is built only from verified
  # modules, exactly the tested ones (build-aar.sh checks), after govulncheck
  # passed over the engine and gomobile's runtime package, and is handed to
  # the jobs below.
  engine:
    uses: ./.github/workflows/engine.yml

  build:
    # Runs even when the engine job failed, so every app check still reports;
    # only the :core:engine tasks then fail, for lack of the AAR.
    needs: engine
    if: ${{ !cancelled() }}
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    defaults:
      run:
        shell: bash # -eo pipefail, so a failing Gradle run fails its step even through tee
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false # the build runs project code; it needs no token

      # Whenever the engine job built it, even if another engine check failed.
      - name: The engine AAR from the engine job
        continue-on-error: true
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: pfengine-aar
          path: engine/build

      # aapt2 refuses an apostrophe without its backslash only at resource merging, minutes in, naming no string (M10-6).
      - name: String resources Android's resource compiler takes (apostrophes, quotes, escapes)
        run: python3 scripts/check_strings.py

      # M11: the Play listing's text, checked like the app's strings (no claim the app may not make, Play's lengths and
      # title words, the limitations stated), and the store assets' sizes and formats against Play's specifications.
      - name: The store listing's claims and the store assets (Google Play)
        if: ${{ !cancelled() }}
        run: |
          python3 scripts/check_listing_claims.py
          python3 scripts/release/store_assets.py check

      # M12: what the app keeps or sends is as the privacy policy and the Play declarations were last reviewed for
      # (docs/m12/policy-review.md), and the version being built has its changelog section and history row
      # (docs/m12/release-history.md); a target API requirement past its date fails here too.
      - name: The data behaviour as reviewed, the release readiness, Google Play's target API
        if: ${{ !cancelled() }}
        run: |
          python3 scripts/check_data_behavior.py
          python3 scripts/release/check_release_ready.py
          python3 scripts/check_target_api.py

      - name: Design tokens and generated colours agree
        if: ${{ !cancelled() }}
        run: |
          python3 design/tools/check_contrast.py
          python3 design/tools/generate_compose_colors.py
          git diff --exit-code -- core/designsystem/src/main/kotlin/app/proxyflow/core/designsystem/theme/Color.kt

      # Gradle steps run only after this passed: a tampered wrapper jar must never run.
      - id: wrapper
        if: ${{ !cancelled() }}
        uses: gradle/actions/wrapper-validation@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1

      - id: java
        if: ${{ !cancelled() && steps.wrapper.outcome == 'success' }}
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: "21"

      - id: gradle
        if: ${{ !cancelled() && steps.java.outcome == 'success' }}
        uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1

      - name: Formatting (ktlint via Spotless)
        if: ${{ !cancelled() && steps.gradle.outcome == 'success' }}
        run: ./gradlew spotlessCheck --continue 2>&1 | tee "$RUNNER_TEMP/gradle-1-spotless.log"

      - name: Android Lint (app and every module it uses, and the engine module)
        if: ${{ !cancelled() && steps.gradle.outcome == 'success' }}
        run: ./gradlew :app:lintDebug :core:engine:lintDebug --continue 2>&1 | tee "$RUNNER_TEMP/gradle-2-lint.log"

      - name: Unit, ViewModel and Robolectric UI tests
        if: ${{ !cancelled() && steps.gradle.outcome == 'success' }}
        run: ./gradlew testDebugUnitTest :core:model:test :lint-rules:test --continue 2>&1 | tee "$RUNNER_TEMP/gradle-3-test.log"

      # The tests above compiled core/data, which exports the Room schema to core/data/schemas.
      # A schema that changed without its file (and a migration, ADR-0009) being committed fails
      # here; the generated file is published with the screenshots for review.
      - name: Room schema in core/data/schemas matches the entities
        if: ${{ !cancelled() && steps.gradle.outcome == 'success' }}
        run: |
          if [ -d core/data/schemas ]; then git add --intent-to-add core/data/schemas; fi
          if ! git diff --exit-code --stat -- core/data/schemas; then
            echo "::error file=core/data/src/main/kotlin/app/proxyflow/core/data/db/ProxyFlowDatabase.kt,title=Room schema::The exported Room schema is not the committed one. Commit the file from ci-screenshots/<branch> (and add a migration if the version changed)."
            exit 1
          fi

      - name: Debug build
        if: ${{ !cancelled() && steps.gradle.outcome == 'success' }}
        run: ./gradlew :app:assembleDebug 2>&1 | tee "$RUNNER_TEMP/gradle-4-debug.log"

      - name: Release build (R8, unsigned unless signing secrets are configured)
        if: ${{ !cancelled() && steps.gradle.outcome == 'success' }}
        run: ./gradlew :app:assembleRelease 2>&1 | tee "$RUNNER_TEMP/gradle-5-release.log"

      # M10's release candidate: the App Bundle Google Play takes, from the same release build (signed in M11).
      - name: Release App Bundle
        if: ${{ !cancelled() && steps.gradle.outcome == 'success' }}
        run: ./gradlew :app:bundleRelease 2>&1 | tee "$RUNNER_TEMP/gradle-5b-bundle.log"

      # M10: the release APK signed with a key made for this run alone, so the owner's phone checks can install what
      # ships (Android installs no unsigned APK; docs/m10/physical-phone-checklist.md). Never for Google Play, which
      # takes the App Bundle signed in M11; kept apart, so the checks below see the release APK alone.
      - name: Release APK signed for testing (a key of this run alone)
        if: ${{ !cancelled() && steps.gradle.outcome == 'success' }}
        run: |
          apk="$(find app/build/outputs/apk/release -maxdepth 1 -name '*.apk' | sort | head -1)"
          tools="$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -1)"
          pass="$(openssl rand -hex 16)"
          keytool -genkeypair -keystore "$RUNNER_TEMP/test-signing.p12" -storetype PKCS12 -storepass "$pass" -alias test \
            -keyalg RSA -keysize 3072 -validity 30 -dname "CN=ProxyFlow test build, O=not for distribution" >/dev/null 2>&1
          mkdir -p app/build/outputs/test-signed
          "$tools/zipalign" -f -p 4 "$apk" "$RUNNER_TEMP/release-aligned.apk"
          "$tools/apksigner" sign --ks "$RUNNER_TEMP/test-signing.p12" --ks-pass "pass:$pass" \
            --out app/build/outputs/test-signed/app-release-test-signed.apk "$RUNNER_TEMP/release-aligned.apk"
          "$tools/apksigner" verify app/build/outputs/test-signed/app-release-test-signed.apk
          rm -f "$RUNNER_TEMP/test-signing.p12"

      # M8: also what the release APK ships for the manifest's @xml files, read back with aapt2 and checked by content
      # in every configuration it ships.
      - name: Release manifest and APK (permissions, backups, debuggable, cleartext, trust, exported components, @xml files)
        if: ${{ !cancelled() && steps.gradle.outcome == 'success' }}
        run: python3 scripts/check_release_manifest.py

      # M8: every library the release build ships, at its resolved version, against OSV (osv.dev): a HIGH or
      # CRITICAL advisory, or an unrated one, fails unless scripts/osv_allowlist.json says why it can't reach
      # ProxyFlow. The engine's Go dependencies are checked by govulncheck in the engine job.
      - name: Known vulnerabilities in the release build's libraries (OSV)
        if: ${{ !cancelled() && steps.gradle.outcome == 'success' }}
        run: |
          ./gradlew -q :app:dependencies --configuration releaseRuntimeClasspath > "$RUNNER_TEMP/release-runtime-classpath.txt"
          python3 scripts/osv_scan.py "$RUNNER_TEMP/release-runtime-classpath.txt"

      # M9: the open-source notices (About, Open-source licences) are what the release build ships: every library on its
      # runtime classpath with the licence its POM declares, and the Go modules linked into the engine (scripts/licences.py).
      # A library that changed, or one whose licence the app has no text for, fails here; the regenerated file is
      # published with the screenshots for review.
      - name: Open-source notices match the release build's libraries
        if: ${{ !cancelled() && steps.gradle.outcome == 'success' }}
        run: |
          ./gradlew -q :app:dependencies --configuration releaseRuntimeClasspath > "$RUNNER_TEMP/release-runtime-classpath.txt"
          python3 scripts/licences.py "$RUNNER_TEMP/release-runtime-classpath.txt" engine/build/pfengine-facts.txt \
            --check feature/about/src/main/assets/open_source_licences.json

      # The checks the device jobs' evidence rests on, against synthetic packet captures and lab logs:
      # each kind of leak they look for must be found, and a clean run must pass.
      - name: The end-to-end evidence scripts' own tests (synthetic captures and logs)
        if: ${{ !cancelled() }}
        run: python3 -m unittest discover -s scripts/tests -v

      # Fails when a screen no longer matches its copy in app/screenshots, and records the new
      # image there; the screenshots job publishes it for review (ci-screenshots/<branch>).
      - name: Screenshots of every screen, light and dark, match app/screenshots (Roborazzi)
        if: ${{ !cancelled() && steps.gradle.outcome == 'success' }}
        run: ./gradlew :app:verifyAndRecordRoborazziDebug 2>&1 | tee "$RUNNER_TEMP/gradle-6-screenshots.log"

      - name: Build facts (test counts, APK sizes, permissions, libraries; emitted as notices)
        if: ${{ !cancelled() && steps.gradle.outcome == 'success' }}
        run: |
          ./gradlew -q :app:dependencies --configuration releaseRuntimeClasspath > "$RUNNER_TEMP/release-runtime-classpath.txt"
          python3 scripts/ci_build_facts.py "$RUNNER_TEMP/release-runtime-classpath.txt"

      - name: Error digest (also emitted as annotations, readable through the API)
        if: failure()
        run: python3 scripts/ci_error_digest.py "$RUNNER_TEMP"/gradle-*.log

      # The artifact keeps them under their common root, the repository root.
      - name: Upload screenshots, the Room schema and the open-source notices (for the screenshots job)
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: screenshots
          path: |
            app/screenshots/
            core/data/schemas/
            feature/about/src/main/assets/open_source_licences.json
          if-no-files-found: error

      - name: Upload reports, screenshots and APKs
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: android-reports
          path: |
            **/build/reports/
            **/build/test-results/
            app/screenshots/
            app/build/outputs/roborazzi/
            app/build/outputs/apk/
            app/build/outputs/bundle/
            app/build/outputs/test-signed/
            core/data/schemas/
          if-no-files-found: warn

  # Publishes the recorded screenshots, the exported Room schema and the regenerated open-source notices on a side branch
  # (ci-screenshots/<branch>), so they can be reviewed and committed without
  # downloading artifacts. Also after a failed build: when a screen changed, its new image is
  # what needs reviewing. Runs separately from the build so that only this job,
  # which runs no project code, holds a token that can push; it never pushes to
  # the PR branch itself.
  screenshots:
    needs: build
    if: ${{ !cancelled() && github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: screenshots
          path: .

      - name: Push the screenshots, schema and notices to ci-screenshots/<branch>
        env:
          HEAD_REF: ${{ github.head_ref }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/screenshots
          if [ -d core/data/schemas ]; then git add core/data/schemas; fi
          notices=feature/about/src/main/assets/open_source_licences.json
          if [ -f "$notices" ]; then git add "$notices"; fi
          git commit --allow-empty -m "Screenshots recorded in CI for $(git rev-parse --short HEAD)"
          git push --force origin "HEAD:refs/heads/ci-screenshots/$HEAD_REF"

  # Real Android runtimes: every version the app supports, from minSdk 29 (Android 10) to targetSdk 36
  # (Android 16) — 29, 34, 35 and 36 since M5, 30–33 since M10's compatibility matrix.
  # - ADR-0006: credentials sealed with Android Keystore keys, the real SQLite, and
  #   every file in the app's data directory checked for plaintext (core/data).
  # - The engine (core/engine): the real libgojni.so carrying TCP through mock SOCKS5
  #   and HTTP CONNECT proxies, TLS checked by the platform trust manager, the whole
  #   packet engine on a socketpair, and logcat searched for the test credentials.
  # - M5 end to end (app, ADR-0010): the real VpnService and engine; Dante (SOCKS5)
  #   and Squid (HTTP CONNECT) with sign-in on the runner; TCP from the emulator's
  #   shell to a destination reachable only by name through a proxy; Android's
  #   consent dialog; revocation, an engine failure, repeated cycles.
  # - M6 end to end (app, ADR-0011): DNS answered on the phone whatever server is asked,
  #   names resolved by the proxies (their own DNS server, logging), TCP by IPv4 and IPv6
  #   address, to an IPv6-only name and to the LAN address, UDP and ping refused, proxies
  #   that stop answering or hang, TLS to the proxy behind stunnel with the run's own CA
  #   (valid, wrong name, expired, untrusted, not TLS, changed while connected), HTTPS to a
  #   site end to end, and the app's diagnostics of each.
  #   Afterwards the lab's logs, logcat and packet captures of the emulator's uplink (its
  #   own -tcpdump, and tcpdump inside it when the image allows) are checked by
  #   scripts/m5_evidence.py and scripts/m6_evidence.py: nothing reached a destination,
  #   a UDP sink or a DNS server around a proxy, and nothing went to a TLS proxy unencrypted.
  # - M8 failure injection (scripts/m8_failure_injection.sh, after the tests): the process
  #   killed while connected, with and without Android's Always-on VPN and "Block connections
  #   without VPN" (set through the test APK's device owner), and a crash with a planted
  #   sign-in; scripts/m8_evidence.py checks the lab's witness (reached only around
  #   ProxyFlow), the captures and Android's crash report against the steps.
  # - M10 performance baseline (PerformanceEndToEndTest): time to Connected, connection set-up,
  #   a dead proxy's connections refused, throughput and its CPU beside the same transfer
  #   straight through the proxy from the same shell client, memory with 200 connections open
  #   (idle, and with data in flight), CPU while idle with the screen off; scripts/m10_performance.py
  #   sets each against the V1 quality bars (docs/m1/01-scope.md §7) and saves m10-performance.json
  #   with the evidence. A network with a sign-in page (ReconnectEndToEndTest).
  # - M10 scenarios (scripts/m10_scenarios.sh): Android 13+ without the notification permission,
  #   connected all the same (N, before the captures stop); then a restart with ProxyFlow as
  #   Always-on VPN with "Block connections without VPN" (R): Android starts it, it connects by
  #   itself, and the lab's witness never answers meanwhile; then, on that connection, with no
  #   instrumentation running, Doze, App Standby's most restricted bucket and Battery Saver (P).
  device:
    needs: engine
    if: ${{ !cancelled() }}
    runs-on: ubuntu-24.04
    timeout-minutes: 155
    strategy:
      fail-fast: false
      matrix:
        api-level: [29, 30, 31, 32, 33, 34, 35, 36]
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # The emulator wanted 7.4 GB free to create API 31's data partition, and one runner had 6.6 GB left by then (run
      # 41875419181: "Not enough space to create userdata partition", so no test ran; M10-96); its capture takes more as
      # the tests run. Toolchains no job here uses are removed first, the free space logged before and after.
      - name: Room on the runner's disk for the emulator and its capture
        run: |
          echo "free before: $(df -Ph / | awk 'NR==2 {print $4 " of " $2}')"
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/.ghcup /usr/share/swift /usr/local/share/powershell \
            /usr/local/share/boost /opt/hostedtoolcache/CodeQL
          echo "free after: $(df -Ph / | awk 'NR==2 {print $4 " of " $2}')"

      # Whenever the engine job built it, even if another engine check failed.
      - name: The engine AAR from the engine job
        continue-on-error: true
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: pfengine-aar
          path: engine/build

      - id: wrapper
        uses: gradle/actions/wrapper-validation@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1

      - id: java
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: "21"

      - id: gradle
        uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1

      # A string the resource compiler refuses fails the build below minutes in; this, in a second (M10-6).
      - name: String resources Android's resource compiler takes
        run: python3 scripts/check_strings.py

      # GitHub's Linux runners have KVM, but only root may use it by default.
      - name: Let the emulator use KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      # sdkmanager's downloads sometimes arrive broken ("Error on ZipFile unknown archive": an API 36 system image in run
      # 41850357364, the emulator in 41869234205, API 35's image in 41883778410), and the emulator step's own install
      # then fails with no test run (M10-105). Installed here first, each up to three times; that install then finds them.
      - name: The emulator and the system image, installed (each up to three times)
        id: sdk
        run: |
          sdkmanager="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$sdkmanager" --licenses >/dev/null 2>&1 || true
          for package in emulator "system-images;android-${{ matrix.api-level }};google_apis;x86_64"; do
            for try in 1 2 3; do
              if out="$("$sdkmanager" --install "$package" --channel=0 2>&1)"; then
                echo "$package: installed (try $try)"
                break
              fi
              # Under -e and pipefail, a grep with no match would end the step here: hence || true (M10-122).
              failed="$(grep -i 'error' <<<"$out" | tail -1 | cut -c1-200)" || true
              echo "$package: try $try failed; sdkmanager's last lines:"
              tail -5 <<<"$out" | cut -c1-200
              if [ "$try" = 3 ]; then
                echo "::error title=Android SDK (API ${{ matrix.api-level }})::$package did not install in three tries; the last error line: ${failed:-none, its last line: $(tail -1 <<<"$out" | cut -c1-200)}"
                exit 1
              fi
              sleep 15
            done
          done

      - name: Build the instrumented tests
        run: |
          ./gradlew :core:data:assembleDebugAndroidTest :core:engine:assembleDebugAndroidTest :app:assembleDebugAndroidTest \
            --continue 2>&1 | tee "$RUNNER_TEMP/gradle-1-device-build.log"

      - name: The end-to-end lab (Dante, Squid, TLS fronts, DNS servers, destinations)
        id: proxies
        if: ${{ !cancelled() }}
        run: bash scripts/e2e_env.sh

      # Runs even when one module's tests failed to build (the engine's, say, without
      # the AAR), so the other modules' device tests still report. The action runs each
      # script line on its own, so the steps are in scripts/e2e_device.sh. The emulator's
      # uplink resolver is the lab's (10.99.0.54), which logs every name the phone looks up.
      - name: Keystore, storage, engine and VPN tests on an emulator (API ${{ matrix.api-level }}), its uplink captured
        id: emulator
        if: ${{ !cancelled() && steps.gradle.outcome == 'success' && steps.sdk.outcome == 'success' }}
        # Inside the job's limit, so the evidence, the digest and the upload below still run if the emulator hangs: the
        # emulator's setup and boot (up to 20 min), then scripts/e2e_device.sh's own budget of 108 — the uplink, the
        # device tests (up to 55), M8's failure injection, M10's parts and the pulls between them, each bounded by what is
        # left of it — and 2 for the action to stop the emulator.
        timeout-minutes: 130
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2.38.0
        with:
          api-level: ${{ matrix.api-level }}
          target: google_apis
          arch: x86_64
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -camera-back none -dns-server 10.99.0.54 -tcpdump ${{ runner.temp }}/emulator-uplink.pcap
          # The action's default of 600 s was not enough for one cold boot on a slower runner (run 41245157563, API 36).
          emulator-boot-timeout: 900
          disable-animations: true
          script: bash scripts/e2e_device.sh ${{ matrix.api-level }}

      - name: End-to-end evidence and the performance baseline (the lab's logs, packet captures, logcat; emitted as annotations)
        if: ${{ !cancelled() && steps.proxies.outcome == 'success' && steps.emulator.outcome != 'skipped' }}
        run: |
          sudo chmod -R a+rX /tmp/pf
          status=0
          for check in m5_evidence m6_evidence m7_evidence m8_evidence m10_performance; do
            python3 "scripts/$check.py" --api ${{ matrix.api-level }} --pf /tmp/pf \
              --out "$RUNNER_TEMP/m5-api${{ matrix.api-level }}" --host-pcap "$RUNNER_TEMP/emulator-uplink.pcap" || status=1
          done
          exit $status

      # The evidence for the report, without the run's passwords file. The captures hold the
      # proxies' sign-ins in clear (plaintext test proxies): random per run, gone with the runner.
      - name: Collect the end-to-end evidence
        if: ${{ !cancelled() && steps.proxies.outcome == 'success' }}
        run: |
          dir="$RUNNER_TEMP/m5-evidence-api${{ matrix.api-level }}"
          mkdir -p "$dir"
          for log in destination.log sink.log destination-address.log destination6.log destination-lan.log tls-destination.log \
                     udp-sink.log gate.log stunnel.log dns-proxies.log dns-uplink.log squid-access.log danted.log bulk.log witness.log log-baseline.properties; do
            sudo cp "/tmp/pf/$log" "$dir/" 2>/dev/null || true
          done
          sudo chown -R "$(id -u):$(id -g)" "$dir"
          cp "$RUNNER_TEMP/emulator-uplink.pcap" "$dir/" 2>/dev/null || true
          cp -r "$RUNNER_TEMP/m5-api${{ matrix.api-level }}/." "$dir/" 2>/dev/null || true

      - name: Device test counts (emitted as notices)
        if: ${{ !cancelled() }}
        run: python3 scripts/ci_build_facts.py --device-tests "API ${{ matrix.api-level }}"

      - name: Error digest (also emitted as annotations, readable through the API)
        if: failure()
        run: python3 scripts/ci_error_digest.py "$RUNNER_TEMP"/gradle-*.log

      - name: Upload device test reports and the end-to-end evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: device-tests-api-${{ matrix.api-level }}
          path: |
            core/data/build/reports/androidTests/
            core/data/build/outputs/androidTest-results/
            core/engine/build/reports/androidTests/
            core/engine/build/outputs/androidTest-results/
            app/build/reports/androidTests/
            app/build/outputs/androidTest-results/
            ${{ runner.temp }}/m5-evidence-api${{ matrix.api-level }}/
          if-no-files-found: warn
