name: android

# App checks: the Go packet engine (engine job: tests with the race detector,
# fuzzing, and the gomobile AAR the Android modules use, built after a
# vulnerability scan of everything it links), formatting (ktlint), Android Lint, JVM and Robolectric tests, the
# committed Room schema, debug and release builds, the release manifest,
# screenshots of every screen compared with the committed ones, and (device
# job) the Android Keystore, storage and engine tests on emulators. The secrets scan
# has its own workflow (secrets.yml), which runs on every push whatever changed.
# Third-party actions are pinned to commit SHAs (tag in the comment) so a
# moved tag cannot change what runs. Each Gradle step runs even when an
# earlier one failed, so one run reports every problem at once; none runs
# unless the Gradle wrapper passed validation.

on:
  push:
    branches: [main]
    paths-ignore: ["spike/**", "docs/**", "**/*.md"]
  pull_request:
    paths-ignore: ["spike/**", "docs/**", "**/*.md"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # The packet engine (engine/, ADR-0001..0005). go.sum is checked against the
  # checksum database; the tests run the adapters against mock SOCKS5 and HTTP
  # CONNECT proxies (sign-in, TLS with a test PKI, timeouts, cancellation),
  # the netstack through them, and check that nothing leaks (goroutines,
  # descriptors) or prints a credential. The AAR is built only from verified
  # modules, exactly the tested ones (build-aar.sh checks), after govulncheck
  # passed over the engine and gomobile's runtime package, and is handed to
  # the jobs below.
  engine:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    defaults:
      run:
        shell: bash
        working-directory: engine
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.27.3"
          cache-dependency-path: engine/go.sum

      - name: Modules match go.sum, go.sum matches the checksum database, go.mod is tidy
        id: modules
        run: |
          go mod download
          go mod verify
          go mod tidy -diff
          # With a hash in go.sum the go command never asks the checksum
          # database. Rebuilt from nothing, every hash comes from
          # sum.golang.org, and the result must be the committed file.
          cp go.sum "$RUNNER_TEMP/go.sum.committed"
          rm go.sum
          go mod tidy
          if ! diff -u "$RUNNER_TEMP/go.sum.committed" go.sum; then
            echo "::error file=engine/go.sum,title=go.sum::go.sum differs from the hashes in the checksum database"
            exit 1
          fi
          echo "::notice title=go.sum::rebuilt with every hash from sum.golang.org: identical to the committed file ($(wc -l < go.sum) lines)"

      - name: Formatting (gofmt) and go vet
        if: ${{ !cancelled() }}
        run: |
          unformatted="$(gofmt -l .)"
          if [ -n "$unformatted" ]; then echo "::error title=gofmt::not formatted: $unformatted"; exit 1; fi
          go vet ./...

      - name: Build the AAR (govulncheck first; gomobile; armeabi-v7a, arm64-v8a, x86_64; 16 KB pages checked)
        id: aar
        if: ${{ !cancelled() && steps.modules.outcome == 'success' }}
        env:
          PF_GOVULNCHECK: "1"
        run: |
          set +e
          ./build-aar.sh > "$RUNNER_TEMP/build-aar.log" 2>&1
          status=$?
          cat "$RUNNER_TEMP/build-aar.log"
          if [ "$status" -ne 0 ]; then
            python3 ../scripts/ci_build_facts.py --log-tail "$RUNNER_TEMP/build-aar.log" build-aar.sh
            exit "$status"
          fi
          python3 ../scripts/ci_build_facts.py --engine-aar build/pfengine-facts.txt

      - name: Upload the AAR (for the build and device jobs)
        if: ${{ !cancelled() && steps.aar.outcome == 'success' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: pfengine-aar
          path: |
            engine/build/pfengine.aar
            engine/build/pfengine-facts.txt
          if-no-files-found: error

      - name: Tests with the race detector (adapters, mock proxies, netstack, lifecycle, leaks)
        if: ${{ !cancelled() }}
        run: |
          set +e
          go test -race -count=1 -json ./... > "$RUNNER_TEMP/go-test.json"
          status=$?
          python3 ../scripts/ci_build_facts.py --go-tests "$RUNNER_TEMP/go-test.json"
          exit $status

      - name: Fuzz every parser (30 s each)
        if: ${{ !cancelled() }}
        run: |
          for target in adapters:FuzzReadSOCKS5Reply adapters:FuzzReadConnectResponse adapters:FuzzParseCredentials \
                        adapters:FuzzConnectRequest fakedns:FuzzResponder; do
            go test -run '^$' -fuzz "^${target#*:}\$" -fuzztime 30s "./${target%%:*}"
          done

  build:
    # Runs even when the engine job failed, so every app check still reports;
    # only the :core:engine tasks then fail, for lack of the AAR.
    needs: engine
    if: ${{ !cancelled() }}
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    defaults:
      run:
        shell: bash # -eo pipefail, so a failing Gradle run fails its step even through tee
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false # the build runs project code; it needs no token

      # Whenever the engine job built it, even if another engine check failed.
      - name: The engine AAR from the engine job
        continue-on-error: true
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: pfengine-aar
          path: engine/build

      - name: Design tokens and generated colours agree
        run: |
          python3 design/tools/check_contrast.py
          python3 design/tools/generate_compose_colors.py
          git diff --exit-code -- core/designsystem/src/main/kotlin/app/proxyflow/core/designsystem/theme/Color.kt

      # Gradle steps run only after this passed: a tampered wrapper jar must never run.
      - id: wrapper
        if: ${{ !cancelled() }}
        uses: gradle/actions/wrapper-validation@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1

      - id: java
        if: ${{ !cancelled() && steps.wrapper.outcome == 'success' }}
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: "21"

      - id: gradle
        if: ${{ !cancelled() && steps.java.outcome == 'success' }}
        uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1

      - name: Formatting (ktlint via Spotless)
        if: ${{ !cancelled() && steps.gradle.outcome == 'success' }}
        run: ./gradlew spotlessCheck --continue 2>&1 | tee "$RUNNER_TEMP/gradle-1-spotless.log"

      - name: Android Lint (app and every module it uses, and the engine module)
        if: ${{ !cancelled() && steps.gradle.outcome == 'success' }}
        run: ./gradlew :app:lintDebug :core:engine:lintDebug --continue 2>&1 | tee "$RUNNER_TEMP/gradle-2-lint.log"

      - name: Unit, ViewModel and Robolectric UI tests
        if: ${{ !cancelled() && steps.gradle.outcome == 'success' }}
        run: ./gradlew testDebugUnitTest :core:model:test --continue 2>&1 | tee "$RUNNER_TEMP/gradle-3-test.log"

      # The tests above compiled core/data, which exports the Room schema to core/data/schemas.
      # A schema that changed without its file (and a migration, ADR-0009) being committed fails
      # here; the generated file is published with the screenshots for review.
      - name: Room schema in core/data/schemas matches the entities
        if: ${{ !cancelled() && steps.gradle.outcome == 'success' }}
        run: |
          if [ -d core/data/schemas ]; then git add --intent-to-add core/data/schemas; fi
          if ! git diff --exit-code --stat -- core/data/schemas; then
            echo "::error file=core/data/src/main/kotlin/app/proxyflow/core/data/db/ProxyFlowDatabase.kt,title=Room schema::The exported Room schema is not the committed one. Commit the file from ci-screenshots/<branch> (and add a migration if the version changed)."
            exit 1
          fi

      - name: Debug build
        if: ${{ !cancelled() && steps.gradle.outcome == 'success' }}
        run: ./gradlew :app:assembleDebug 2>&1 | tee "$RUNNER_TEMP/gradle-4-debug.log"

      - name: Release build (R8, unsigned unless signing secrets are configured)
        if: ${{ !cancelled() && steps.gradle.outcome == 'success' }}
        run: ./gradlew :app:assembleRelease 2>&1 | tee "$RUNNER_TEMP/gradle-5-release.log"

      - name: Release manifest (permissions, backups, debuggable, cleartext, exported components)
        if: ${{ !cancelled() && steps.gradle.outcome == 'success' }}
        run: python3 scripts/check_release_manifest.py

      # Fails when a screen no longer matches its copy in app/screenshots, and records the new
      # image there; the screenshots job publishes it for review (ci-screenshots/<branch>).
      - name: Screenshots of every screen, light and dark, match app/screenshots (Roborazzi)
        if: ${{ !cancelled() && steps.gradle.outcome == 'success' }}
        run: ./gradlew :app:verifyAndRecordRoborazziDebug 2>&1 | tee "$RUNNER_TEMP/gradle-6-screenshots.log"

      - name: Build facts (test counts, APK sizes, permissions, libraries; emitted as notices)
        if: ${{ !cancelled() && steps.gradle.outcome == 'success' }}
        run: |
          ./gradlew -q :app:dependencies --configuration releaseRuntimeClasspath > "$RUNNER_TEMP/release-runtime-classpath.txt"
          python3 scripts/ci_build_facts.py "$RUNNER_TEMP/release-runtime-classpath.txt"

      - name: Error digest (also emitted as annotations, readable through the API)
        if: failure()
        run: python3 scripts/ci_error_digest.py "$RUNNER_TEMP"/gradle-*.log

      # Two paths: the artifact keeps them under their common root, the repository root.
      - name: Upload screenshots and the Room schema (for the screenshots job)
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: screenshots
          path: |
            app/screenshots/
            core/data/schemas/
          if-no-files-found: error

      - name: Upload reports, screenshots and APKs
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: android-reports
          path: |
            **/build/reports/
            **/build/test-results/
            app/screenshots/
            app/build/outputs/roborazzi/
            app/build/outputs/apk/
            core/data/schemas/
          if-no-files-found: warn

  # Publishes the recorded screenshots and the exported Room schema on a side branch
  # (ci-screenshots/<branch>), so they can be reviewed and committed without
  # downloading artifacts. Also after a failed build: when a screen changed, its new image is
  # what needs reviewing. Runs separately from the build so that only this job,
  # which runs no project code, holds a token that can push; it never pushes to
  # the PR branch itself.
  screenshots:
    needs: build
    if: ${{ !cancelled() && github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: screenshots
          path: .

      - name: Push the screenshots and schema to ci-screenshots/<branch>
        env:
          HEAD_REF: ${{ github.head_ref }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/screenshots
          if [ -d core/data/schemas ]; then git add core/data/schemas; fi
          git commit --allow-empty -m "Screenshots recorded in CI for $(git rev-parse --short HEAD)"
          git push --force origin "HEAD:refs/heads/ci-screenshots/$HEAD_REF"

  # Real Android runtimes: the oldest supported (minSdk 29), the first with
  # foreground-service types (34), and current ones (35, 36).
  # - ADR-0006: credentials sealed with Android Keystore keys, the real SQLite, and
  #   every file in the app's data directory checked for plaintext (core/data).
  # - The engine (core/engine): the real libgojni.so carrying TCP through mock SOCKS5
  #   and HTTP CONNECT proxies, TLS checked by the platform trust manager, the whole
  #   packet engine on a socketpair, and logcat searched for the test credentials.
  # - M5 end to end (app, ADR-0010): the real VpnService and engine; Dante (SOCKS5)
  #   and Squid (HTTP CONNECT) with sign-in on the runner; TCP from the emulator's
  #   shell to a destination reachable only by name through a proxy; Android's
  #   consent dialog; revocation, an engine failure, repeated cycles.
  # - M6 end to end (app, ADR-0011): DNS answered on the phone whatever server is asked,
  #   names resolved by the proxies (their own DNS server, logging), TCP by IPv4 and IPv6
  #   address, to an IPv6-only name and to the LAN address, UDP and ping refused, proxies
  #   that stop answering or hang, TLS to the proxy behind stunnel with the run's own CA
  #   (valid, wrong name, expired, untrusted, not TLS, changed while connected), HTTPS to a
  #   site end to end, and the app's diagnostics of each.
  #   Afterwards the lab's logs, logcat and packet captures of the emulator's uplink (its
  #   own -tcpdump, and tcpdump inside it when the image allows) are checked by
  #   scripts/m5_evidence.py and scripts/m6_evidence.py: nothing reached a destination,
  #   a UDP sink or a DNS server around a proxy, and nothing went to a TLS proxy unencrypted.
  device:
    needs: engine
    if: ${{ !cancelled() }}
    runs-on: ubuntu-24.04
    timeout-minutes: 100
    strategy:
      fail-fast: false
      matrix:
        api-level: [29, 34, 35, 36]
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Whenever the engine job built it, even if another engine check failed.
      - name: The engine AAR from the engine job
        continue-on-error: true
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: pfengine-aar
          path: engine/build

      - id: wrapper
        uses: gradle/actions/wrapper-validation@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1

      - id: java
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: "21"

      - id: gradle
        uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1

      # GitHub's Linux runners have KVM, but only root may use it by default.
      - name: Let the emulator use KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Build the instrumented tests
        run: |
          ./gradlew :core:data:assembleDebugAndroidTest :core:engine:assembleDebugAndroidTest :app:assembleDebugAndroidTest \
            --continue 2>&1 | tee "$RUNNER_TEMP/gradle-1-device-build.log"

      - name: The end-to-end lab (Dante, Squid, TLS fronts, DNS servers, destinations)
        id: proxies
        if: ${{ !cancelled() }}
        run: bash scripts/e2e_env.sh

      # Runs even when one module's tests failed to build (the engine's, say, without
      # the AAR), so the other modules' device tests still report. The action runs each
      # script line on its own, so the steps are in scripts/e2e_device.sh. The emulator's
      # uplink resolver is the lab's (10.99.0.54), which logs every name the phone looks up.
      - name: Keystore, storage, engine and VPN tests on an emulator (API ${{ matrix.api-level }}), its uplink captured
        id: emulator
        if: ${{ !cancelled() && steps.gradle.outcome == 'success' }}
        # Inside the job's limit, so the evidence, the digest and the upload below still run if the emulator hangs.
        timeout-minutes: 78
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2.38.0
        with:
          api-level: ${{ matrix.api-level }}
          target: google_apis
          arch: x86_64
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -camera-back none -dns-server 10.99.0.54 -tcpdump ${{ runner.temp }}/emulator-uplink.pcap
          # The action's default of 600 s was not enough for one cold boot on a slower runner (run 41245157563, API 36).
          emulator-boot-timeout: 900
          disable-animations: true
          script: bash scripts/e2e_device.sh ${{ matrix.api-level }}

      - name: End-to-end evidence (the lab's logs, packet captures, logcat; emitted as annotations)
        if: ${{ !cancelled() && steps.proxies.outcome == 'success' && steps.emulator.outcome != 'skipped' }}
        run: |
          sudo chmod -R a+rX /tmp/pf
          status=0
          for check in m5_evidence m6_evidence; do
            python3 "scripts/$check.py" --api ${{ matrix.api-level }} --pf /tmp/pf \
              --out "$RUNNER_TEMP/m5-api${{ matrix.api-level }}" --host-pcap "$RUNNER_TEMP/emulator-uplink.pcap" || status=1
          done
          exit $status

      # The evidence for the report, without the run's passwords file. The captures hold the
      # proxies' sign-ins in clear (plaintext test proxies): random per run, gone with the runner.
      - name: Collect the end-to-end evidence
        if: ${{ !cancelled() && steps.proxies.outcome == 'success' }}
        run: |
          dir="$RUNNER_TEMP/m5-evidence-api${{ matrix.api-level }}"
          mkdir -p "$dir"
          for log in destination.log sink.log destination-address.log destination6.log destination-lan.log tls-destination.log \
                     udp-sink.log gate.log stunnel.log dns-proxies.log dns-uplink.log squid-access.log danted.log log-baseline.properties; do
            sudo cp "/tmp/pf/$log" "$dir/" 2>/dev/null || true
          done
          sudo chown -R "$(id -u):$(id -g)" "$dir"
          cp "$RUNNER_TEMP/emulator-uplink.pcap" "$dir/" 2>/dev/null || true
          cp -r "$RUNNER_TEMP/m5-api${{ matrix.api-level }}/." "$dir/" 2>/dev/null || true

      - name: Device test counts (emitted as notices)
        if: ${{ !cancelled() }}
        run: python3 scripts/ci_build_facts.py --device-tests "API ${{ matrix.api-level }}"

      - name: Error digest (also emitted as annotations, readable through the API)
        if: failure()
        run: python3 scripts/ci_error_digest.py "$RUNNER_TEMP"/gradle-*.log

      - name: Upload device test reports and the end-to-end evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: device-tests-api-${{ matrix.api-level }}
          path: |
            core/data/build/reports/androidTests/
            core/data/build/outputs/androidTest-results/
            core/engine/build/reports/androidTests/
            core/engine/build/outputs/androidTest-results/
            app/build/reports/androidTests/
            app/build/outputs/androidTest-results/
            ${{ runner.temp }}/m5-evidence-api${{ matrix.api-level }}/
          if-no-files-found: warn
