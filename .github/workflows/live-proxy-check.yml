name: live-proxy-check

# The signed release used with the owner's own proxy on the real internet, on a clean emulator, the way a person uses
# it (scripts/live_proxy_check.sh): started by hand only. The proxy's address, port, username and password come from
# the repository's secrets PF_LIVE_PROXY_HOST, PF_LIVE_PROXY_PORT, PF_LIVE_PROXY_USERNAME and PF_LIVE_PROXY_PASSWORD
# (set with `gh secret set`; never in the repository, never in an input: a workflow input is not masked in the log);
# GitHub masks the secrets, and the job masks them again before anything runs. The build is the signed release run's
# universal APK (its artifact release-bundle-upload-key — the same bytes a phone outside Play installs), checked
# against the upload certificate's fingerprint; nothing is built but the shell client of the tests, from the commit
# the run is on. The screenshots kept show no address, username or password (the form is not photographed, and keeps
# itself out of screenshots anyway); the uplink capture and the evidence file name the proxy, so neither leaves the runner's
# artifact (the capture not even that).

on:
  workflow_dispatch:
    inputs:
      release-run:
        description: "The signed release run's id (Actions → release → the hand-started run), whose universal APK is used"
        required: true
        type: string
      fingerprint:
        description: "SHA-256 fingerprint of the upload certificate (colon-separated); the installed app's must match"
        required: true
        type: string
      protocol:
        description: "The proxy's protocol"
        required: true
        type: choice
        options: [HTTP, SOCKS5]
        default: HTTP
      api-level:
        description: "The emulator's Android API level"
        required: true
        type: choice
        options: ["29", "30", "31", "32", "33", "34", "35", "36"]
        default: "36"

permissions:
  contents: read
  actions: read

concurrency:
  group: live-proxy-check
  cancel-in-progress: false

jobs:
  engine:
    uses: ./.github/workflows/engine.yml

  check:
    needs: engine
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    defaults:
      run:
        shell: bash
    steps:
      - name: The proxy's details, masked before anything else runs
        env:
          H: ${{ secrets.PF_LIVE_PROXY_HOST }}
          P: ${{ secrets.PF_LIVE_PROXY_PORT }}
          U: ${{ secrets.PF_LIVE_PROXY_USERNAME }}
          W: ${{ secrets.PF_LIVE_PROXY_PASSWORD }}
        run: |
          if [ -z "$H" ] || [ -z "$P" ]; then
            echo "::error title=Live proxy check::the secrets PF_LIVE_PROXY_HOST and PF_LIVE_PROXY_PORT are not set (gh secret set …)"
            exit 1
          fi
          for v in "$H" "$P" "$U" "$W"; do [ -n "$v" ] && echo "::add-mask::$v"; done
          echo "the proxy: given (host, port$([ -n "$U" ] && echo ', username and password' || echo ', no sign-in'))"

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Room on the runner's disk for the emulator
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/.ghcup /usr/share/swift /usr/local/share/powershell \
            /usr/local/share/boost /opt/hostedtoolcache/CodeQL
          echo "free: $(df -Ph / | awk 'NR==2 {print $4 " of " $2}')"

      - name: The signed release run's universal APK (artifact release-bundle-upload-key)
        env:
          GH_TOKEN: ${{ github.token }}
          RUN: ${{ inputs.release-run }}
        run: |
          mkdir -p release
          gh run download "$RUN" --repo "$GITHUB_REPOSITORY" -n release-bundle-upload-key -D release
          ls -l release
          [ -s release/universal.apk ] || { echo "::error title=Live proxy check::no universal.apk in run $RUN's artifact release-bundle-upload-key"; exit 1; }
          grep -E '^(mode|event|ref|commit|version|fingerprint|bundle-sha256)=' release/release-facts.txt
          grep -q '^mode=upload-key$' release/release-facts.txt || { echo "::error title=Live proxy check::run $RUN's bundle is not an upload-key bundle"; exit 1; }
          version="$(sed -n 's/^version=//p' release/release-facts.txt)"
          echo "VERSION_NAME=${version%% *}" >> "$GITHUB_ENV"
          code="${version#*(}"; echo "VERSION_CODE=${code%)}" >> "$GITHUB_ENV"
          echo "APK_SHA256=$(sha256sum release/universal.apk | cut -d' ' -f1)" >> "$GITHUB_ENV"

      - name: The engine AAR from the engine job (for the shell client's test APK)
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: pfengine-aar
          path: engine/build

      - uses: gradle/actions/wrapper-validation@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1

      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: "21"

      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1

      - name: Let the emulator use KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: The emulator and the system image, installed (each up to three times)
        run: |
          sdkmanager="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$sdkmanager" --licenses >/dev/null 2>&1 || true
          for package in emulator "system-images;android-${{ inputs.api-level }};google_apis;x86_64"; do
            for try in 1 2 3; do
              if out="$("$sdkmanager" --install "$package" --channel=0 2>&1)"; then
                echo "$package: installed (try $try)"
                break
              fi
              echo "$package: try $try failed; sdkmanager's last lines:"
              tail -5 <<<"$out" | cut -c1-200
              if [ "$try" = 3 ]; then
                echo "::error title=Android SDK (API ${{ inputs.api-level }})::$package did not install in three tries"
                exit 1
              fi
              sleep 15
            done
          done

      - name: The shell client (the instrumented tests' APK)
        run: ./gradlew :app:assembleDebugAndroidTest 2>&1 | tee "$RUNNER_TEMP/gradle-client.log"

      - name: The runner's own public address (what a leak would look like)
        run: |
          ip="$(curl -fsS --max-time 15 'https://api.ipify.org/?format=text' || true)"
          echo "RUNNER_PUBLIC_IP=$ip" >> "$GITHUB_ENV"
          echo "the runner is $ip from outside"

      - name: The signed release used with the owner's proxy on a clean emulator (API ${{ inputs.api-level }})
        timeout-minutes: 35
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2.38.0
        env:
          PF_LIVE_PROXY_PROTOCOL: ${{ inputs.protocol }}
          PF_LIVE_PROXY_HOST: ${{ secrets.PF_LIVE_PROXY_HOST }}
          PF_LIVE_PROXY_PORT: ${{ secrets.PF_LIVE_PROXY_PORT }}
          PF_LIVE_PROXY_USERNAME: ${{ secrets.PF_LIVE_PROXY_USERNAME }}
          PF_LIVE_PROXY_PASSWORD: ${{ secrets.PF_LIVE_PROXY_PASSWORD }}
          EXPECTED_FINGERPRINT: ${{ inputs.fingerprint }}
          EXPECTED_VERSION_NAME: ${{ env.VERSION_NAME }}
          EXPECTED_VERSION_CODE: ${{ env.VERSION_CODE }}
          APPLICATION_ID: app.proxyflow.android
          CLIENT_APK: app/build/outputs/apk/androidTest/debug/app-debug-androidTest.apk
          UPLINK_PCAP: ${{ runner.temp }}/emulator-uplink.pcap
        with:
          api-level: ${{ inputs.api-level }}
          target: google_apis
          arch: x86_64
          profile: pixel_5
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -camera-back none -tcpdump ${{ runner.temp }}/emulator-uplink.pcap
          emulator-boot-timeout: 900
          disable-animations: true
          script: bash scripts/live_proxy_check.sh release/universal.apk ${{ inputs.api-level }} live-check

      - name: What was checked
        if: ${{ always() }}
        run: |
          echo "::notice title=Live proxy check::release run ${{ inputs.release-run }}'s universal.apk (SHA-256 ${APK_SHA256:-?}), version ${VERSION_NAME:-?} (${VERSION_CODE:-?}), on API ${{ inputs.api-level }} with the owner's ${{ inputs.protocol }} proxy; commit $GITHUB_SHA"

      - name: Upload the screenshots and facts (not the capture, which names the proxy)
        if: ${{ always() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: live-proxy-check-api-${{ inputs.api-level }}
          path: |
            live-check/
            !live-check/package.txt
            !live-check/installed-certs.txt
          if-no-files-found: warn
          retention-days: 14

  # The screenshots on a side branch (ci-live-check), so they can be looked at without downloading the artifact: only
  # this job, which runs no project code, holds a token that can push. The images show the app's screens alone.
  publish:
    needs: check
    if: ${{ always() && needs.check.result != 'skipped' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: live-proxy-check-api-${{ inputs.api-level }}
          path: live-check
      - name: Push the screenshots to ci-live-check
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout --orphan ci-live-check
          git rm -rfq . >/dev/null 2>&1 || true
          mkdir -p "api-${{ inputs.api-level }}"
          cp live-check/*.png "api-${{ inputs.api-level }}/" 2>/dev/null || true
          git add "api-${{ inputs.api-level }}"
          git commit --allow-empty -m "Live proxy check, run $GITHUB_RUN_ID (API ${{ inputs.api-level }}, ${{ needs.check.result }})"
          git push --force origin HEAD:refs/heads/ci-live-check
