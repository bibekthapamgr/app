name: release

# M11: the signed App Bundle for Google Play, and the proof that what it installs works — on clean emulators, through
# the app's own screens, through a proxy (docs/m11/signing.md, docs/m11/release-checklist.md).
#
# The key. Only a run the owner starts by hand (workflow_dispatch) on main uses the upload key — the one Google Play's App
# Signing accepts uploads from — from the repository's secrets PROXYFLOW_KEYSTORE_BASE64, PROXYFLOW_KEYSTORE_PASSWORD and
# PROXYFLOW_KEY_PASSWORD (made by scripts/release/make_upload_key.sh; the alias is the repository variable
# PROXYFLOW_KEY_ALIAS, or proxyflow-upload), and it must be given the upload certificate's SHA-256 fingerprint as the
# input "fingerprint" (the script prints it), which is checked against the key's: a bundle signed with another key than
# the one Play knows is refused here before it can be refused there. That run's bundle is the one to upload. Every other
# run — a push, a pull request — never sees the secrets (review A-3: a branch's build scripts run with the key in their
# environment otherwise) and signs the bundle with a key made for the run alone and thrown away with it, so every push
# still proves the whole path (build, sign, verify, install, use); such a bundle is never uploaded, and can't be
# mistaken for the other: the mode is in the artifact's name and in the notices of the key, the version, the
# signatures and the bundle; the event and the ref in the facts and in the key's and the bundle's notices.
# No password is ever printed or put on a command line: the secrets are masked by GitHub, the run key's by ::add-mask::,
# keytool reads them from the environment, bundletool from a file, and Gradle from the environment of its step alone.
#
# Third-party actions are pinned to commit SHAs (tag in the comment). bundletool is Google's own, pinned to a release
# and to its SHA-256 (BUNDLETOOL_SHA256 below).

on:
  push:
    branches: [main]
    paths-ignore: ["spike/**", "docs/**", "**/*.md"]
  pull_request:
    paths-ignore: ["spike/**", "docs/**", "**/*.md"]
  workflow_dispatch:
    inputs:
      fingerprint:
        description: "SHA-256 fingerprint of the upload certificate (colon-separated, as make_upload_key.sh printed it); the bundle is signed with the upload key only when it matches. Leave empty for a run-key bundle."
        required: false
        type: string

permissions:
  contents: read

# A push to a branch cancels that branch's earlier push run, never a run the owner started by hand (review A-7).
concurrency:
  group: release-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name != 'workflow_dispatch' }}

env:
  BUNDLETOOL_VERSION: "1.18.3"
  # bundletool-all-1.18.3.jar's SHA-256 as downloaded from google/bundletool's release on 2026-11-07 (docs/m11/signing.md §4).
  BUNDLETOOL_SHA256: "a099cfa1543f55593bc2ed16a70a7c67fe54b1747bb7301f37fdfd6d91028e29"

jobs:
  engine:
    uses: ./.github/workflows/engine.yml

  # The signed bundle: built, its signature verified against the key (and the given fingerprint), the release manifest
  # and APK checks of M8 run on the same build, bundletool's APK set built from it for the smoke, everything attached.
  bundle:
    needs: engine
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    defaults:
      run:
        shell: bash
    outputs:
      version-name: ${{ steps.version.outputs.name }}
      version-code: ${{ steps.version.outputs.code }}
      fingerprint: ${{ steps.key.outputs.fingerprint }}
      mode: ${{ steps.key.outputs.mode }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: The engine AAR from the engine job
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: pfengine-aar
          path: engine/build

      - id: wrapper
        uses: gradle/actions/wrapper-validation@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1

      - uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          distribution: temurin
          java-version: "21"

      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1

      - name: String resources Android's resource compiler takes
        run: python3 scripts/check_strings.py

      # The key, in $RUNNER_TEMP (outside the checkout, gone with the runner): the upload key from the secrets on a
      # workflow_dispatch run, or one made for this run. Its four values go to signing.env (mode 600), read into the
      # environment of the steps that sign and verify, and nowhere else; the passwords also to two mode-600 files for
      # bundletool; all removed at the end of the job whatever happened.
      - name: The signing key (the upload key from the secrets on a hand-started run, or a key of this run alone)
        id: key
        env:
          # The secrets reach only a hand-started run on main: a push's or pull request's run, and a hand-started run of
          # any other branch (whose build scripts are not main's: review F-7), get empty strings here.
          KEYSTORE_BASE64: ${{ github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && secrets.PROXYFLOW_KEYSTORE_BASE64 || '' }}
          KEYSTORE_PASSWORD: ${{ github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && secrets.PROXYFLOW_KEYSTORE_PASSWORD || '' }}
          KEY_PASSWORD: ${{ github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && secrets.PROXYFLOW_KEY_PASSWORD || '' }}
          KEY_ALIAS: ${{ vars.PROXYFLOW_KEY_ALIAS || 'proxyflow-upload' }}
          GIVEN_FINGERPRINT: ${{ inputs.fingerprint }}
        run: |
          umask 077
          store="$RUNNER_TEMP/signing.p12"
          # The fingerprint as given, however pasted: spaces, a "SHA256:" or "SHA-256" label, lower case.
          given="$(sed -E 's/^[[:space:]]*(SHA-?256[[:space:]]*(certificate)?[[:space:]]*(Fingerprint)?[[:space:]]*[:=]?)?[[:space:]]*//I; s/[[:space:]]//g' <<<"$GIVEN_FINGERPRINT" | tr 'a-f' 'A-F')"
          # keytool prints the fingerprint with colons; one pasted without them (64 hex characters) is taken too.
          if [[ "$given" =~ ^[0-9A-F]{64}$ ]]; then given="$(sed 's/../&:/g; s/:$//' <<<"$given")"; fi
          if [ -n "$KEYSTORE_BASE64" ]; then
            if [ -z "$KEYSTORE_PASSWORD" ] || [ -z "$KEY_PASSWORD" ]; then
              echo "::error title=Signing::PROXYFLOW_KEYSTORE_BASE64 is set but PROXYFLOW_KEYSTORE_PASSWORD or PROXYFLOW_KEY_PASSWORD is not"
              exit 1
            fi
            if [ -z "$given" ]; then
              echo "::error title=Signing::a hand-started run with the upload key needs the input \"fingerprint\" (the upload certificate's SHA-256, as make_upload_key.sh printed it), so that the key is checked to be the one Google Play knows"
              exit 1
            fi
            if ! printf '%s' "$KEYSTORE_BASE64" | base64 -d > "$store" 2>/dev/null; then
              echo "::error title=Signing::PROXYFLOW_KEYSTORE_BASE64 is not base64 (make it with: base64 -w0 proxyflow-upload.p12)"
              exit 1
            fi
            mode=upload-key
          else
            if [ "$GITHUB_EVENT_NAME" = workflow_dispatch ] && [ -n "$given" ]; then
              echo "::error title=Signing::a fingerprint was given but this run has no upload key: the secret PROXYFLOW_KEYSTORE_BASE64 is not set, or the run is not on main (the upload key is handed to hand-started runs on main alone; this one is on $GITHUB_REF)"
              exit 1
            fi
            KEYSTORE_PASSWORD="$(openssl rand -hex 24)"
            KEY_PASSWORD="$KEYSTORE_PASSWORD"
            KEY_ALIAS=run-key
            echo "::add-mask::$KEYSTORE_PASSWORD"
            export PF_STORE_PASS="$KEYSTORE_PASSWORD" PF_KEY_PASS="$KEY_PASSWORD"
            keytool -genkeypair -keystore "$store" -storetype PKCS12 -storepass:env PF_STORE_PASS -keypass:env PF_KEY_PASS -alias "$KEY_ALIAS" \
              -keyalg RSA -keysize 3072 -validity 30 -dname "CN=ProxyFlow run key, O=not for distribution" >/dev/null
            mode=run-key
          fi
          export PF_STORE_PASS="$KEYSTORE_PASSWORD"
          if ! keytool -list -keystore "$store" -storepass:env PF_STORE_PASS -alias "$KEY_ALIAS" >/dev/null 2>&1; then
            echo "::error title=Signing::the keystore does not open with the password given, or has no key named '$KEY_ALIAS' (the repository variable PROXYFLOW_KEY_ALIAS, or proxyflow-upload)"
            exit 1
          fi
          fingerprint="$(keytool -list -v -keystore "$store" -storepass:env PF_STORE_PASS -alias "$KEY_ALIAS" 2>/dev/null \
            | sed -n 's/^[[:space:]]*SHA256: //p' | head -1)"
          if [ -z "$fingerprint" ]; then echo "::error title=Signing::keytool printed no SHA-256 fingerprint for the key"; exit 1; fi
          if [ "$mode" = upload-key ] && [ "$given" != "$fingerprint" ]; then
            echo "::error title=Signing::the key's certificate is $fingerprint, not the fingerprint given ($given): this is not the upload key Google Play knows"
            exit 1
          fi
          keytool -exportcert -rfc -keystore "$store" -storepass:env PF_STORE_PASS -alias "$KEY_ALIAS" > "$RUNNER_TEMP/signing-certificate.pem" 2>/dev/null \
            || { echo "::error title=Signing::keytool could not export the key's certificate"; exit 1; }
          {
            echo "PROXYFLOW_KEYSTORE_FILE=$store"
            echo "PROXYFLOW_KEYSTORE_PASSWORD=$KEYSTORE_PASSWORD"
            echo "PROXYFLOW_KEY_ALIAS=$KEY_ALIAS"
            echo "PROXYFLOW_KEY_PASSWORD=$KEY_PASSWORD"
          } > "$RUNNER_TEMP/signing.env"
          printf '%s' "$KEYSTORE_PASSWORD" > "$RUNNER_TEMP/ks-pass.txt"
          printf '%s' "$KEY_PASSWORD" > "$RUNNER_TEMP/key-pass.txt"
          echo "mode=$mode" >> "$GITHUB_OUTPUT"
          echo "fingerprint=$fingerprint" >> "$GITHUB_OUTPUT"
          echo "::notice title=Signing key ($mode)::$GITHUB_EVENT_NAME on $GITHUB_REF; certificate SHA-256 $fingerprint${given:+ — matches the fingerprint given}"

      - name: Release App Bundle and APK, signed (R8)
        run: |
          set -a; . "$RUNNER_TEMP/signing.env"; set +a
          ./gradlew :app:bundleRelease :app:assembleRelease 2>&1 | tee "$RUNNER_TEMP/gradle-release.log"

      - name: The version this build carries
        id: version
        run: |
          tools="$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -1)"
          apk="$(find app/build/outputs/apk/release -maxdepth 1 -name '*.apk' | sort | head -1)"
          "$tools/aapt2" dump badging "$apk" > "$RUNNER_TEMP/badging.txt"
          field() { sed -n "s/.*$1='\([^']*\)'.*/\1/p" "$RUNNER_TEMP/badging.txt" | head -1; }
          name="$(field versionName)"
          code="$(field versionCode)"
          id="$(grep '^package:' "$RUNNER_TEMP/badging.txt" | sed -n "s/.* name='\([^']*\)'.*/\1/p")"
          [ "$id" = "app.proxyflow.android" ] || { echo "::error title=Release::the application id is '$id', not app.proxyflow.android"; exit 1; }
          [ -n "$name" ] && [ -n "$code" ] || { echo "::error title=Release::aapt2 printed no version for the release APK"; exit 1; }
          echo "name=$name" >> "$GITHUB_OUTPUT"
          echo "code=$code" >> "$GITHUB_OUTPUT"
          grep -E "^(package|sdkVersion|targetSdkVersion|native-code|application-debuggable)" "$RUNNER_TEMP/badging.txt" || true
          # The badging of this APK printed no sdkVersion line in run 42359705613 (the target, yes); the minimum is read from
          # the manifest's own attribute, and the smoke on API 29 is what proves it installs there.
          "$tools/aapt2" dump xmltree "$apk" --file AndroidManifest.xml 2>/dev/null | grep -i 'sdkversion' | head -3 || true
          min="$("$tools/aapt2" dump xmltree "$apk" --file AndroidManifest.xml 2>/dev/null | grep -oiE 'minSdkVersion[^=]*=(\(type 0x10\))?(0x[0-9a-f]+|[0-9]+)' | head -1 | sed -E 's/.*=(\(type 0x10\))?//' || true)"
          case "$min" in 0x*) min=$((16#${min#0x})) ;; esac
          target="$(grep -o "targetSdkVersion:'[0-9]*'" "$RUNNER_TEMP/badging.txt" | grep -o '[0-9]*' | head -1 || true)"
          native="$(grep -o "native-code:.*" "$RUNNER_TEMP/badging.txt" | head -1 || true)"
          [ "$target" = "36" ] || { echo "::error title=Release::the release APK targets SDK '${target:-?}', not 36 (Google Play's requirement for new apps since 31 August 2026)"; exit 1; }
          echo "::notice title=Release version (${{ steps.key.outputs.mode }})::$id $name ($code), minSdk ${min:-?}, targetSdk $target; $native"

      # Signed by the key, and by no other: the bundle's jar signature (what Play checks on upload) verifies, and the
      # certificate in its signature block is the key's; the APK's v2/v3 signature carries exactly one certificate, the key's.
      - name: The bundle's and the APK's signatures are the key's
        run: |
          tools="$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -1)"
          aab="$(find app/build/outputs/bundle/release -maxdepth 1 -name '*.aab' | sort | head -1)"
          apk="$(find app/build/outputs/apk/release -maxdepth 1 -name '*.apk' | sort | head -1)"
          expected="${{ steps.key.outputs.fingerprint }}"
          [ -n "$aab" ] || { echo "::error title=Signing::no App Bundle was built"; exit 1; }
          case "$apk" in *unsigned*) echo "::error title=Signing::the release APK is unsigned: Gradle did not see the signing configuration"; exit 1 ;; esac
          jarsigner -verify "$aab" > "$RUNNER_TEMP/jarsigner.txt" 2>&1 || true
          grep -q '^jar verified' "$RUNNER_TEMP/jarsigner.txt" || { echo "::error title=Signing::the App Bundle's signature does not verify: $(tail -3 "$RUNNER_TEMP/jarsigner.txt" | tr '\n' ' ')"; exit 1; }
          echo "META-INF of $(basename "$aab"):"; unzip -Z1 "$aab" | grep '^META-INF/' || echo "  (none)"
          block="$(unzip -Z1 "$aab" | grep -E '^META-INF/.*\.(RSA|EC|DSA)$' || true)"
          blocks="$(printf '%s' "$block" | grep -c . || true)"
          [ "$blocks" = 1 ] || { echo "::error title=Signing::the App Bundle has $blocks signature blocks, not one (jarsigner said: $(head -1 "$RUNNER_TEMP/jarsigner.txt"))"; exit 1; }
          unzip -p "$aab" "$block" > "$RUNNER_TEMP/aab-block.der"
          openssl pkcs7 -inform DER -in "$RUNNER_TEMP/aab-block.der" -print_certs -out "$RUNNER_TEMP/aab-certs.pem" 2> "$RUNNER_TEMP/openssl.txt" \
            || { echo "::error title=Signing::openssl could not read the bundle's signature block $block: $(tr '\n' ' ' < "$RUNNER_TEMP/openssl.txt")"; exit 1; }
          aab_fp="$(openssl x509 -in "$RUNNER_TEMP/aab-certs.pem" -noout -fingerprint -sha256 2>>"$RUNNER_TEMP/openssl.txt" | sed 's/^.*Fingerprint=//' || true)"
          [ -n "$aab_fp" ] || { echo "::error title=Signing::no certificate fingerprint could be read from the bundle's signature block: $(tr '\n' ' ' < "$RUNNER_TEMP/openssl.txt")"; exit 1; }
          [ "$aab_fp" = "$expected" ] || { echo "::error title=Signing::the App Bundle's certificate is $aab_fp, not the key's $expected"; exit 1; }
          "$tools/apksigner" verify --print-certs "$apk" > "$RUNNER_TEMP/apk-certs.txt" 2>&1 \
            || { echo "::error title=Signing::apksigner does not verify the release APK: $(tail -3 "$RUNNER_TEMP/apk-certs.txt" | tr '\n' ' ')"; exit 1; }
          # apksigner names signers "Signer #1 …" in older build-tools and "V2 Signer: …"/"V3 Signer: …" in newer ones (run
          # 42361282491): the signers are the distinct certificates it prints.
          digests="$(grep -oE 'certificate SHA-256 digest: [0-9a-f]{64}' "$RUNNER_TEMP/apk-certs.txt" | grep -oE '[0-9a-f]{64}' | sort -u || true)"
          signers="$(printf '%s' "$digests" | grep -c . || true)"
          apk_fp="$(printf '%s' "$digests" | head -1 | tr 'a-f' 'A-F' | sed 's/../&:/g; s/:$//')"
          [ "$signers" = 1 ] || { echo "::error title=Signing::the release APK has $signers signers, not one; apksigner said: $(grep -v '^WARNING' "$RUNNER_TEMP/apk-certs.txt" | head -5 | tr '\n' ' ')"; exit 1; }
          [ "$apk_fp" = "$expected" ] || { echo "::error title=Signing::the release APK's certificate is $apk_fp, not the key's $expected"; exit 1; }
          echo "::notice title=Signatures (${{ steps.key.outputs.mode }})::the App Bundle verifies (jarsigner) and its certificate is the key's; the release APK has one signer, the key's certificate ($apk_fp)"

      - name: Release manifest and APK (permissions, backups, debuggable, cleartext, trust, exported components, @xml files)
        run: python3 scripts/check_release_manifest.py

      - name: bundletool, Google's, pinned
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          jar="bundletool-all-$BUNDLETOOL_VERSION.jar"
          mkdir -p "$RUNNER_TEMP/bundletool"
          gh release download "$BUNDLETOOL_VERSION" --repo google/bundletool --pattern "$jar" --dir "$RUNNER_TEMP/bundletool"
          sum="$(sha256sum "$RUNNER_TEMP/bundletool/$jar" | cut -d' ' -f1)"
          if [ "$sum" != "$BUNDLETOOL_SHA256" ]; then
            echo "::error title=bundletool::$jar's SHA-256 is $sum, not the pinned ${BUNDLETOOL_SHA256:-(none pinned)}"
            exit 1
          fi
          echo "BUNDLETOOL=$RUNNER_TEMP/bundletool/$jar" >> "$GITHUB_ENV"
          echo "::notice title=bundletool (${{ steps.key.outputs.mode }})::$jar, SHA-256 $sum (pinned)"

      # What Play would hand a phone: the APK set (every split, signed with the key, from which install-apks picks a
      # device's), and the universal APK for a phone outside Play. Built here, where the key is, so the smoke job needs
      # none.
      - name: The bundle's APK set and universal APK (bundletool)
        run: |
          set -a; . "$RUNNER_TEMP/signing.env"; set +a
          aab="$(find app/build/outputs/bundle/release -maxdepth 1 -name '*.aab' | sort | head -1)"
          out=app/build/outputs/release
          mkdir -p "$out"
          java -jar "$BUNDLETOOL" validate --bundle="$aab" > "$out/bundle-validate.txt"
          java -jar "$BUNDLETOOL" build-apks --bundle="$aab" --output="$out/release.apks" --overwrite \
            --ks="$PROXYFLOW_KEYSTORE_FILE" --ks-pass="file:$RUNNER_TEMP/ks-pass.txt" --ks-key-alias="$PROXYFLOW_KEY_ALIAS" --key-pass="file:$RUNNER_TEMP/key-pass.txt"
          java -jar "$BUNDLETOOL" build-apks --bundle="$aab" --output="$out/universal.apks" --overwrite --mode=universal \
            --ks="$PROXYFLOW_KEYSTORE_FILE" --ks-pass="file:$RUNNER_TEMP/ks-pass.txt" --ks-key-alias="$PROXYFLOW_KEY_ALIAS" --key-pass="file:$RUNNER_TEMP/key-pass.txt"
          unzip -o -q "$out/universal.apks" universal.apk -d "$out"
          java -jar "$BUNDLETOOL" get-size total --apks="$out/release.apks" > "$out/download-size.txt"
          cp "$aab" "$out/"
          cp "$RUNNER_TEMP/signing-certificate.pem" "$out/"
          cp app/build/outputs/mapping/release/mapping.txt "$out/" 2>/dev/null || true
          {
            echo "mode=${{ steps.key.outputs.mode }}"
            echo "fingerprint=${{ steps.key.outputs.fingerprint }}"
            echo "version=${{ steps.version.outputs.name }} (${{ steps.version.outputs.code }})"
            echo "event=$GITHUB_EVENT_NAME"
            echo "ref=$GITHUB_REF"
            echo "commit=$GITHUB_SHA"
            echo "run=$GITHUB_RUN_ID attempt $GITHUB_RUN_ATTEMPT"
            echo "bundletool=$BUNDLETOOL_VERSION sha256 $BUNDLETOOL_SHA256"
            echo "native-libraries=$(unzip -Z1 "$out/universal.apk" 'lib/*' 2>/dev/null | cut -d/ -f2 | sort -u | tr '\n' ' ' || true)"
            echo "bundle-sha256=$(sha256sum "$aab" | cut -d' ' -f1)"
            echo "bundle-bytes=$(stat -c %s "$aab")"
            echo "download-size-bytes-min-max=$(tail -1 "$out/download-size.txt" | tr -d '\r\n')"
          } > "$out/release-facts.txt"
          echo "::notice title=Release bundle (${{ steps.key.outputs.mode }})::$GITHUB_EVENT_NAME on $GITHUB_REF; $(basename "$aab"): $(stat -c %s "$aab") bytes, SHA-256 $(sha256sum "$aab" | cut -d' ' -f1); download size per device $(tail -1 "$out/download-size.txt" | tr -d '\r\n') bytes (min,max); the universal APK $(stat -c %s "$out/universal.apk") bytes; native libraries: $(unzip -Z1 "$out/universal.apk" 'lib/*' 2>/dev/null | sort | tr '\n' ' ' || true)"

      - name: Remove the key
        if: ${{ always() }}
        run: rm -f "$RUNNER_TEMP/signing.env" "$RUNNER_TEMP/signing.p12" "$RUNNER_TEMP/ks-pass.txt" "$RUNNER_TEMP/key-pass.txt"

      - name: Upload the signed bundle, the APK set, the universal APK, the certificate and the mapping
        if: ${{ always() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-bundle-${{ steps.key.outputs.mode }}
          path: |
            app/build/outputs/release/
            !app/build/outputs/release/universal.apks
          if-no-files-found: warn
          retention-days: 30

  # The bundle installed and used on clean emulators, the oldest and the newest Android ProxyFlow supports, from its own
  # screens (scripts/m11_signed_smoke.sh): the certificate, the version, Connected through the lab's proxy, a line
  # through the tunnel, the witness and the uplink resolver silent, Disconnect; the screen recorded.
  smoke:
    needs: bundle
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        api-level: [29, 36]
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Room on the runner's disk for the emulator
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/.ghcup /usr/share/swift /usr/local/share/powershell \
            /usr/local/share/boost /opt/hostedtoolcache/CodeQL
          echo "free: $(df -Ph / | awk 'NR==2 {print $4 " of " $2}')"

      - name: The signed bundle's APK set from the bundle job
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-bundle-${{ needs.bundle.outputs.mode }}
          path: release

      - name: The engine AAR from the engine job (for the shell client's test APK)
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: pfengine-aar
          path: engine/build

      - uses: gradle/actions/wrapper-validation@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1

      - uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          distribution: temurin
          java-version: "21"

      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1

      - name: Let the emulator use KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: The emulator and the system image, installed (each up to three times)
        id: sdk
        run: |
          sdkmanager="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$sdkmanager" --licenses >/dev/null 2>&1 || true
          for package in emulator "system-images;android-${{ matrix.api-level }};google_apis;x86_64"; do
            for try in 1 2 3; do
              if out="$("$sdkmanager" --install "$package" --channel=0 2>&1)"; then
                echo "$package: installed (try $try)"
                break
              fi
              failed="$(grep -i 'error' <<<"$out" | tail -1 | cut -c1-200)" || true
              echo "$package: try $try failed; sdkmanager's last lines:"
              tail -5 <<<"$out" | cut -c1-200
              if [ "$try" = 3 ]; then
                echo "::error title=Android SDK (API ${{ matrix.api-level }})::$package did not install in three tries; the last error line: ${failed:-none}"
                exit 1
              fi
              sleep 15
            done
          done

      # The shell client that sends one line to a lab destination from outside the app (M5–M10's) lives in the
      # instrumented tests' APK; nothing of it is installed — it is run with app_process by the shell user.
      - name: The shell client (the instrumented tests' APK)
        run: ./gradlew :app:assembleDebugAndroidTest 2>&1 | tee "$RUNNER_TEMP/gradle-client.log"

      - name: bundletool, Google's, pinned
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          jar="bundletool-all-$BUNDLETOOL_VERSION.jar"
          mkdir -p "$RUNNER_TEMP/bundletool"
          gh release download "$BUNDLETOOL_VERSION" --repo google/bundletool --pattern "$jar" --dir "$RUNNER_TEMP/bundletool"
          sum="$(sha256sum "$RUNNER_TEMP/bundletool/$jar" | cut -d' ' -f1)"
          if [ "$sum" != "$BUNDLETOOL_SHA256" ]; then
            echo "::error title=bundletool::$jar's SHA-256 is $sum, not the pinned ${BUNDLETOOL_SHA256:-(none pinned)}"
            exit 1
          fi
          echo "BUNDLETOOL=$RUNNER_TEMP/bundletool/$jar" >> "$GITHUB_ENV"

      - name: The end-to-end lab (Dante, Squid, TLS fronts, DNS servers, destinations)
        id: proxies
        run: bash scripts/e2e_env.sh

      # For the recording's length in the smoke's notice; the smoke says "not measured" without it.
      - name: ffprobe, for the screen recording's length
        run: sudo apt-get install -y --no-install-recommends ffmpeg >/dev/null 2>&1 || echo "ffmpeg did not install; the recording's length will not be measured"

      - name: The signed bundle installed and used on a clean emulator (API ${{ matrix.api-level }})
        id: emulator
        timeout-minutes: 40
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2.38.0
        env:
          EXPECTED_FINGERPRINT: ${{ needs.bundle.outputs.fingerprint }}
          EXPECTED_VERSION_NAME: ${{ needs.bundle.outputs.version-name }}
          EXPECTED_VERSION_CODE: ${{ needs.bundle.outputs.version-code }}
          APPLICATION_ID: app.proxyflow.android
          CLIENT_APK: app/build/outputs/apk/androidTest/debug/app-debug-androidTest.apk
        with:
          api-level: ${{ matrix.api-level }}
          target: google_apis
          arch: x86_64
          # A phone's screen (the emulator's default device is small), so the Add proxy form fits as on a phone (review B-4).
          profile: pixel_5
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -camera-back none -dns-server 10.99.0.54
          emulator-boot-timeout: 900
          disable-animations: true
          script: bash scripts/m11_signed_smoke.sh release/release.apks ${{ matrix.api-level }} smoke-api-${{ matrix.api-level }}

      - name: Upload the smoke's screenshots, recording and facts
        if: ${{ always() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: signed-smoke-api-${{ matrix.api-level }}
          path: smoke-api-${{ matrix.api-level }}/
          if-no-files-found: warn
          retention-days: 30
