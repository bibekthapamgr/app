name: release

# M11: the signed App Bundle for Google Play, and the proof that what it installs works — on clean emulators, through
# the app's own screens, through a proxy (docs/m11/signing.md, docs/m11/release-checklist.md).
#
# The key. With the repository's signing secrets set (PROXYFLOW_KEYSTORE_BASE64, PROXYFLOW_KEYSTORE_PASSWORD,
# PROXYFLOW_KEY_ALIAS, PROXYFLOW_KEY_PASSWORD: the upload key made by scripts/release/make_upload_key.sh), the bundle is
# signed with the upload key — the one Google Play's App Signing accepts uploads from — and this is the bundle to upload.
# Without them, the bundle is signed with a key made for this run alone and thrown away with it, so every push still
# proves the whole path (build, sign, verify, install, use); such a bundle is never uploaded. The mode is in every
# annotation and in the artifact's facts. The upload certificate's SHA-256 fingerprint, given as the workflow_dispatch
# input "fingerprint" (make_upload_key.sh prints it), is checked against the key's: a bundle signed with another key than
# the one Play knows is refused here before it can be refused there. No password is ever printed: the secrets are masked
# by GitHub, the run key's by ::add-mask::, and Gradle reads them from the environment of its step alone.
#
# Third-party actions are pinned to commit SHAs (tag in the comment). bundletool is Google's own, pinned to a release;
# its SHA-256 is checked against BUNDLETOOL_SHA256 below.

on:
  push:
    branches: [main]
    paths-ignore: ["spike/**", "docs/**", "**/*.md"]
  pull_request:
    paths-ignore: ["spike/**", "docs/**", "**/*.md"]
  workflow_dispatch:
    inputs:
      fingerprint:
        description: "SHA-256 fingerprint of the upload certificate (colon-separated, as make_upload_key.sh printed it); checked against the key the bundle is signed with"
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

env:
  BUNDLETOOL_VERSION: "1.18.3"
  # The jar's SHA-256, recorded from its first download here (docs/m11/signing.md §4); empty until then, when it is only printed.
  BUNDLETOOL_SHA256: ""

jobs:
  engine:
    uses: ./.github/workflows/engine.yml

  # The signed bundle: built, its signature verified against the key (and the given fingerprint), the release manifest
  # and APK checks of M8 run on the same build, bundletool's APK set built from it for the smoke, everything attached.
  bundle:
    needs: engine
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    defaults:
      run:
        shell: bash
    outputs:
      version-name: ${{ steps.version.outputs.name }}
      version-code: ${{ steps.version.outputs.code }}
      fingerprint: ${{ steps.key.outputs.fingerprint }}
      mode: ${{ steps.key.outputs.mode }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: The engine AAR from the engine job
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: pfengine-aar
          path: engine/build

      - id: wrapper
        uses: gradle/actions/wrapper-validation@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1

      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: "21"

      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1

      - name: String resources Android's resource compiler takes
        run: python3 scripts/check_strings.py

      # The key, in $RUNNER_TEMP (outside the checkout, gone with the runner): the upload key from the secrets, or one
      # made for this run. Its four values go to signing.env (mode 600), read into the environment of the steps that
      # sign and verify, and nowhere else; the file is removed at the end of the job whatever happened.
      - name: The signing key (the upload key from the secrets, or a key of this run alone)
        id: key
        env:
          KEYSTORE_BASE64: ${{ secrets.PROXYFLOW_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.PROXYFLOW_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.PROXYFLOW_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.PROXYFLOW_KEY_PASSWORD }}
          GIVEN_FINGERPRINT: ${{ inputs.fingerprint }}
        run: |
          umask 077
          store="$RUNNER_TEMP/signing.p12"
          if [ -n "$KEYSTORE_BASE64" ]; then
            if [ -z "$KEYSTORE_PASSWORD" ] || [ -z "$KEY_ALIAS" ] || [ -z "$KEY_PASSWORD" ]; then
              echo "::error title=Signing::PROXYFLOW_KEYSTORE_BASE64 is set but PROXYFLOW_KEYSTORE_PASSWORD, PROXYFLOW_KEY_ALIAS or PROXYFLOW_KEY_PASSWORD is not"
              exit 1
            fi
            if ! printf '%s' "$KEYSTORE_BASE64" | base64 -d > "$store" 2>/dev/null; then
              echo "::error title=Signing::PROXYFLOW_KEYSTORE_BASE64 is not base64 (make it with: base64 -w0 proxyflow-upload.p12)"
              exit 1
            fi
            mode=upload-key
          else
            KEYSTORE_PASSWORD="$(openssl rand -hex 24)"
            KEY_PASSWORD="$KEYSTORE_PASSWORD"
            KEY_ALIAS=run-key
            echo "::add-mask::$KEYSTORE_PASSWORD"
            keytool -genkeypair -keystore "$store" -storetype PKCS12 -storepass "$KEYSTORE_PASSWORD" -alias "$KEY_ALIAS" \
              -keyalg RSA -keysize 3072 -validity 30 -dname "CN=ProxyFlow run key, O=not for distribution" >/dev/null 2>&1
            mode=run-key
          fi
          if ! keytool -list -keystore "$store" -storepass "$KEYSTORE_PASSWORD" -alias "$KEY_ALIAS" >/dev/null 2>&1; then
            echo "::error title=Signing::the keystore does not open with the password given, or has no key named '$KEY_ALIAS'"
            exit 1
          fi
          fingerprint="$(keytool -list -v -keystore "$store" -storepass "$KEYSTORE_PASSWORD" -alias "$KEY_ALIAS" 2>/dev/null \
            | sed -n 's/^[[:space:]]*SHA256: //p' | head -1)"
          if [ -z "$fingerprint" ]; then echo "::error title=Signing::keytool printed no SHA-256 fingerprint for the key"; exit 1; fi
          if [ -n "$GIVEN_FINGERPRINT" ] && [ "$(tr 'a-f' 'A-F' <<<"$GIVEN_FINGERPRINT")" != "$fingerprint" ]; then
            echo "::error title=Signing::the key's certificate is $fingerprint, not the fingerprint given ($GIVEN_FINGERPRINT): this is not the upload key Google Play knows"
            exit 1
          fi
          keytool -exportcert -rfc -keystore "$store" -storepass "$KEYSTORE_PASSWORD" -alias "$KEY_ALIAS" > "$RUNNER_TEMP/signing-certificate.pem" 2>/dev/null
          {
            echo "PROXYFLOW_KEYSTORE_FILE=$store"
            echo "PROXYFLOW_KEYSTORE_PASSWORD=$KEYSTORE_PASSWORD"
            echo "PROXYFLOW_KEY_ALIAS=$KEY_ALIAS"
            echo "PROXYFLOW_KEY_PASSWORD=$KEY_PASSWORD"
          } > "$RUNNER_TEMP/signing.env"
          echo "mode=$mode" >> "$GITHUB_OUTPUT"
          echo "fingerprint=$fingerprint" >> "$GITHUB_OUTPUT"
          echo "::notice title=Signing key::$mode; certificate SHA-256 $fingerprint${GIVEN_FINGERPRINT:+ (matches the fingerprint given)}"

      - name: Release App Bundle and APK, signed (R8)
        run: |
          set -a; . "$RUNNER_TEMP/signing.env"; set +a
          ./gradlew :app:bundleRelease :app:assembleRelease 2>&1 | tee "$RUNNER_TEMP/gradle-release.log"

      - name: The version this build carries
        id: version
        run: |
          tools="$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -1)"
          apk="$(find app/build/outputs/apk/release -maxdepth 1 -name '*.apk' | sort | head -1)"
          "$tools/aapt2" dump badging "$apk" > "$RUNNER_TEMP/badging.txt"
          field() { sed -n "s/.*$1='\([^']*\)'.*/\1/p" "$RUNNER_TEMP/badging.txt" | head -1; }
          name="$(field versionName)"
          code="$(field versionCode)"
          id="$(grep '^package:' "$RUNNER_TEMP/badging.txt" | sed -n "s/.* name='\([^']*\)'.*/\1/p")"
          [ "$id" = "app.proxyflow.android" ] || { echo "::error title=Release::the application id is '$id', not app.proxyflow.android"; exit 1; }
          [ -n "$name" ] && [ -n "$code" ] || { echo "::error title=Release::aapt2 printed no version for the release APK"; exit 1; }
          echo "name=$name" >> "$GITHUB_OUTPUT"
          echo "code=$code" >> "$GITHUB_OUTPUT"
          grep -E "^(package|sdkVersion|targetSdkVersion|native-code|application-debuggable)" "$RUNNER_TEMP/badging.txt" || true
          min="$(grep -o "sdkVersion:'[0-9]*'" "$RUNNER_TEMP/badging.txt" | grep -v target | grep -o '[0-9]*' | head -1)"
          target="$(grep -o "targetSdkVersion:'[0-9]*'" "$RUNNER_TEMP/badging.txt" | grep -o '[0-9]*' | head -1)"
          echo "::notice title=Release version::$id $name ($code), minSdk ${min:-?}, targetSdk ${target:-?}; native code $(grep -o "native-code:.*" "$RUNNER_TEMP/badging.txt" | head -1)"

      # Signed by the key, and by no other: the bundle's jar signature (what Play checks on upload) verifies, and the
      # certificate in its signature block is the key's; the APK's v2/v3 signature carries exactly one certificate, the key's.
      - name: The bundle's and the APK's signatures are the key's
        run: |
          tools="$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -1)"
          aab="$(find app/build/outputs/bundle/release -maxdepth 1 -name '*.aab' | sort | head -1)"
          apk="$(find app/build/outputs/apk/release -maxdepth 1 -name '*.apk' | sort | head -1)"
          expected="${{ steps.key.outputs.fingerprint }}"
          [ -n "$aab" ] || { echo "::error title=Signing::no App Bundle was built"; exit 1; }
          case "$apk" in *unsigned*) echo "::error title=Signing::the release APK is unsigned: Gradle did not see the signing configuration"; exit 1 ;; esac
          jarsigner -verify "$aab" > "$RUNNER_TEMP/jarsigner.txt" 2>&1 || true
          grep -q '^jar verified' "$RUNNER_TEMP/jarsigner.txt" || { echo "::error title=Signing::the App Bundle's signature does not verify: $(tail -3 "$RUNNER_TEMP/jarsigner.txt" | tr '\n' ' ')"; exit 1; }
          echo "META-INF of $(basename "$aab"):"; unzip -Z1 "$aab" | grep '^META-INF/' || echo "  (none)"
          block="$(unzip -Z1 "$aab" | grep -E '^META-INF/.*\.(RSA|EC|DSA)$' || true)"
          blocks="$(printf '%s' "$block" | grep -c . || true)"
          [ "$blocks" = 1 ] || { echo "::error title=Signing::the App Bundle has $blocks signature blocks, not one (jarsigner said: $(head -1 "$RUNNER_TEMP/jarsigner.txt"))"; exit 1; }
          aab_fp="$(unzip -p "$aab" "$block" | openssl pkcs7 -inform DER -print_certs | openssl x509 -noout -fingerprint -sha256 | sed 's/^.*Fingerprint=//')"
          [ "$aab_fp" = "$expected" ] || { echo "::error title=Signing::the App Bundle's certificate is $aab_fp, not the key's $expected"; exit 1; }
          "$tools/apksigner" verify --print-certs "$apk" > "$RUNNER_TEMP/apk-certs.txt"
          signers="$(grep -c '^Signer #[0-9]* certificate SHA-256 digest' "$RUNNER_TEMP/apk-certs.txt")"
          apk_fp="$(sed -n 's/^Signer #1 certificate SHA-256 digest: //p' "$RUNNER_TEMP/apk-certs.txt" | head -1 | tr 'a-f' 'A-F' | sed 's/../&:/g; s/:$//')"
          [ "$signers" = 1 ] || { echo "::error title=Signing::the release APK has $signers signers, not one"; exit 1; }
          [ "$apk_fp" = "$expected" ] || { echo "::error title=Signing::the release APK's certificate is $apk_fp, not the key's $expected"; exit 1; }
          echo "::notice title=Signatures::the App Bundle verifies (jarsigner) and its certificate is the key's; the release APK has one signer, the key's certificate ($apk_fp)"

      - name: Release manifest and APK (permissions, backups, debuggable, cleartext, trust, exported components, @xml files)
        run: python3 scripts/check_release_manifest.py

      - name: bundletool, Google's, pinned
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          jar="bundletool-all-$BUNDLETOOL_VERSION.jar"
          mkdir -p "$RUNNER_TEMP/bundletool"
          gh release download "$BUNDLETOOL_VERSION" --repo google/bundletool --pattern "$jar" --dir "$RUNNER_TEMP/bundletool"
          sum="$(sha256sum "$RUNNER_TEMP/bundletool/$jar" | cut -d' ' -f1)"
          if [ -n "$BUNDLETOOL_SHA256" ] && [ "$sum" != "$BUNDLETOOL_SHA256" ]; then
            echo "::error title=bundletool::$jar's SHA-256 is $sum, not the pinned $BUNDLETOOL_SHA256"
            exit 1
          fi
          echo "BUNDLETOOL=$RUNNER_TEMP/bundletool/$jar" >> "$GITHUB_ENV"
          echo "::notice title=bundletool::$jar, SHA-256 $sum${BUNDLETOOL_SHA256:+ (pinned)}"

      # What Play would hand a phone: the APK set (every split, signed with the key, from which install-apks picks a
      # device's), and the universal APK for a phone outside Play. Built here, where the key is, so the smoke job needs
      # none.
      - name: The bundle's APK set and universal APK (bundletool)
        run: |
          set -a; . "$RUNNER_TEMP/signing.env"; set +a
          aab="$(find app/build/outputs/bundle/release -maxdepth 1 -name '*.aab' | sort | head -1)"
          out=app/build/outputs/release
          mkdir -p "$out"
          java -jar "$BUNDLETOOL" validate --bundle="$aab" > "$out/bundle-validate.txt"
          java -jar "$BUNDLETOOL" build-apks --bundle="$aab" --output="$out/release.apks" --overwrite \
            --ks="$PROXYFLOW_KEYSTORE_FILE" --ks-pass="pass:$PROXYFLOW_KEYSTORE_PASSWORD" --ks-key-alias="$PROXYFLOW_KEY_ALIAS" --key-pass="pass:$PROXYFLOW_KEY_PASSWORD"
          java -jar "$BUNDLETOOL" build-apks --bundle="$aab" --output="$out/universal.apks" --overwrite --mode=universal \
            --ks="$PROXYFLOW_KEYSTORE_FILE" --ks-pass="pass:$PROXYFLOW_KEYSTORE_PASSWORD" --ks-key-alias="$PROXYFLOW_KEY_ALIAS" --key-pass="pass:$PROXYFLOW_KEY_PASSWORD"
          unzip -o -q "$out/universal.apks" universal.apk -d "$out"
          java -jar "$BUNDLETOOL" get-size total --apks="$out/release.apks" > "$out/download-size.txt"
          cp "$aab" "$out/"
          cp "$RUNNER_TEMP/signing-certificate.pem" "$out/"
          cp app/build/outputs/mapping/release/mapping.txt "$out/" 2>/dev/null || true
          {
            echo "mode=${{ steps.key.outputs.mode }}"
            echo "fingerprint=${{ steps.key.outputs.fingerprint }}"
            echo "version=${{ steps.version.outputs.name }} (${{ steps.version.outputs.code }})"
            echo "commit=$GITHUB_SHA"
            echo "run=$GITHUB_RUN_ID attempt $GITHUB_RUN_ATTEMPT"
            echo "bundle-sha256=$(sha256sum "$aab" | cut -d' ' -f1)"
            echo "bundle-bytes=$(stat -c %s "$aab")"
            echo "download-size-bytes-min-max=$(tail -1 "$out/download-size.txt")"
          } > "$out/release-facts.txt"
          echo "::notice title=Release bundle (${{ steps.key.outputs.mode }})::$(basename "$aab"): $(stat -c %s "$aab") bytes, SHA-256 $(sha256sum "$aab" | cut -d' ' -f1); download size per device $(tail -1 "$out/download-size.txt") bytes (min,max); the universal APK $(stat -c %s "$out/universal.apk") bytes"

      - name: Remove the key
        if: ${{ always() }}
        run: rm -f "$RUNNER_TEMP/signing.env" "$RUNNER_TEMP/signing.p12"

      - name: Upload the signed bundle, the APK set, the universal APK, the certificate and the mapping
        if: ${{ always() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-bundle-${{ steps.key.outputs.mode }}
          path: |
            app/build/outputs/release/
            !app/build/outputs/release/universal.apks
          if-no-files-found: warn
          retention-days: 30

  # The bundle installed and used on clean emulators, the oldest and the newest Android ProxyFlow supports, from its own
  # screens (scripts/m11_signed_smoke.sh): the certificate, the version, Connected through the lab's proxy, a line
  # through the tunnel, the witness and the uplink resolver silent, Disconnect; the screen recorded.
  smoke:
    needs: bundle
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        api-level: [29, 36]
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Room on the runner's disk for the emulator
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/.ghcup /usr/share/swift /usr/local/share/powershell \
            /usr/local/share/boost /opt/hostedtoolcache/CodeQL
          echo "free: $(df -Ph / | awk 'NR==2 {print $4 " of " $2}')"

      - name: The signed bundle's APK set from the bundle job
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-bundle-${{ needs.bundle.outputs.mode }}
          path: release

      - name: The engine AAR from the engine job (for the shell client's test APK)
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: pfengine-aar
          path: engine/build

      - uses: gradle/actions/wrapper-validation@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1

      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: "21"

      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1

      - name: Let the emulator use KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: The emulator and the system image, installed (each up to three times)
        id: sdk
        run: |
          sdkmanager="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$sdkmanager" --licenses >/dev/null 2>&1 || true
          for package in emulator "system-images;android-${{ matrix.api-level }};google_apis;x86_64"; do
            for try in 1 2 3; do
              if out="$("$sdkmanager" --install "$package" --channel=0 2>&1)"; then
                echo "$package: installed (try $try)"
                break
              fi
              failed="$(grep -i 'error' <<<"$out" | tail -1 | cut -c1-200)" || true
              echo "$package: try $try failed; sdkmanager's last lines:"
              tail -5 <<<"$out" | cut -c1-200
              if [ "$try" = 3 ]; then
                echo "::error title=Android SDK (API ${{ matrix.api-level }})::$package did not install in three tries; the last error line: ${failed:-none}"
                exit 1
              fi
              sleep 15
            done
          done

      # The shell client that sends one line to a lab destination from outside the app (M5–M10's) lives in the
      # instrumented tests' APK; nothing of it is installed — it is run with app_process by the shell user.
      - name: The shell client (the instrumented tests' APK)
        run: ./gradlew :app:assembleDebugAndroidTest 2>&1 | tee "$RUNNER_TEMP/gradle-client.log"

      - name: bundletool, Google's, pinned
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          jar="bundletool-all-$BUNDLETOOL_VERSION.jar"
          mkdir -p "$RUNNER_TEMP/bundletool"
          gh release download "$BUNDLETOOL_VERSION" --repo google/bundletool --pattern "$jar" --dir "$RUNNER_TEMP/bundletool"
          sum="$(sha256sum "$RUNNER_TEMP/bundletool/$jar" | cut -d' ' -f1)"
          if [ -n "$BUNDLETOOL_SHA256" ] && [ "$sum" != "$BUNDLETOOL_SHA256" ]; then
            echo "::error title=bundletool::$jar's SHA-256 is $sum, not the pinned $BUNDLETOOL_SHA256"
            exit 1
          fi
          echo "BUNDLETOOL=$RUNNER_TEMP/bundletool/$jar" >> "$GITHUB_ENV"

      - name: The end-to-end lab (Dante, Squid, TLS fronts, DNS servers, destinations)
        id: proxies
        run: bash scripts/e2e_env.sh

      - name: The signed bundle installed and used on a clean emulator (API ${{ matrix.api-level }})
        id: emulator
        timeout-minutes: 40
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2.38.0
        env:
          EXPECTED_FINGERPRINT: ${{ needs.bundle.outputs.fingerprint }}
          EXPECTED_VERSION_NAME: ${{ needs.bundle.outputs.version-name }}
          EXPECTED_VERSION_CODE: ${{ needs.bundle.outputs.version-code }}
          APPLICATION_ID: app.proxyflow.android
          CLIENT_APK: app/build/outputs/apk/androidTest/debug/app-debug-androidTest.apk
        with:
          api-level: ${{ matrix.api-level }}
          target: google_apis
          arch: x86_64
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -camera-back none -dns-server 10.99.0.54
          emulator-boot-timeout: 900
          disable-animations: true
          script: bash scripts/m11_signed_smoke.sh release/release.apks ${{ matrix.api-level }} smoke-api-${{ matrix.api-level }}

      - name: Upload the smoke's screenshots, recording and facts
        if: ${{ always() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: signed-smoke-api-${{ matrix.api-level }}
          path: smoke-api-${{ matrix.api-level }}/
          if-no-files-found: warn
          retention-days: 30
