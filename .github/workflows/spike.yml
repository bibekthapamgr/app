name: m1-feasibility-spike

# Runs the M1 feasibility spike on a stock Ubuntu runner (IPv6-enabled kernel,
# so the IPv6 end-to-end case runs here even though the original sandbox run
# had to skip it). go.sum was generated from an offline module mirror, so CI
# first rebuilds it from proxy.golang.org — every hash checked against the
# public checksum database sum.golang.org — and fails if it differs.

# Actions are pinned to commit SHAs (tag in the comment), as in android.yml.
# Pull requests don't trigger it: the spike takes up to 30 minutes and only
# changes with M1 work. Run it from the Actions tab (workflow_dispatch) on a
# branch that touches spike/.
on:
  push:
    branches: [main]
    paths: ["spike/**", ".github/workflows/spike.yml"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  spike:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version: "1.27.3"
          cache-dependency-path: spike/engine/go.sum
      - name: Check go.sum against the public checksum database
        working-directory: spike/engine
        run: |
          cp go.sum /tmp/go.sum.committed && rm go.sum
          GOFLAGS=-mod=mod go list -deps -test ./... > /dev/null   # re-adds hashes, verified via sum.golang.org
          diff <(sort /tmp/go.sum.committed) <(sort go.sum)
          go mod verify                                             # module cache matches go.sum
      - name: System packages
        run: |
          sudo apt-get update -qq
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -qq iproute2 tcpdump tshark iperf3 \
            squid dante-server stunnel4 dnsutils iputils-ping curl openssl python3-pip
          sudo systemctl stop squid danted 2>/dev/null || true
          sudo pip3 install --break-system-packages pytest cryptography
      - name: Run spike
        run: sudo -E env "PATH=$PATH" HEV_TAG=2.19.3 FUZZTIME=30s GO_TEST_REPEAT=5 spike/run_spike.sh
      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: m1-spike-evidence
          path: spike/evidence/
