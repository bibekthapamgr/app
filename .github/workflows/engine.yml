# The Go engine: modules verified against the checksum database, gofmt and vet, the AAR for the three ABIs
# (govulncheck first, 16 KB pages checked), the tests with the race detector, and the fuzzers. A reusable workflow
# (M11): the Android build (android.yml) and the release (release.yml) both call it, so the AAR a release ships is
# built and checked exactly as every CI run's is. Uploads the AAR as the artifact pfengine-aar.
name: engine

on:
  workflow_call:

permissions:
  contents: read

jobs:
  engine:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    defaults:
      run:
        shell: bash
        working-directory: engine
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.27.3"
          cache-dependency-path: engine/go.sum

      - name: Modules match go.sum, go.sum matches the checksum database, go.mod is tidy
        id: modules
        run: |
          go mod download
          go mod verify
          go mod tidy -diff
          # With a hash in go.sum the go command never asks the checksum
          # database. Rebuilt from nothing, every hash comes from
          # sum.golang.org, and the result must be the committed file.
          cp go.sum "$RUNNER_TEMP/go.sum.committed"
          rm go.sum
          go mod tidy
          if ! diff -u "$RUNNER_TEMP/go.sum.committed" go.sum; then
            echo "::error file=engine/go.sum,title=go.sum::go.sum differs from the hashes in the checksum database"
            exit 1
          fi
          echo "::notice title=go.sum::rebuilt with every hash from sum.golang.org: identical to the committed file ($(wc -l < go.sum) lines)"

      - name: Formatting (gofmt) and go vet
        if: ${{ !cancelled() }}
        run: |
          unformatted="$(gofmt -l .)"
          if [ -n "$unformatted" ]; then echo "::error title=gofmt::not formatted: $unformatted"; exit 1; fi
          go vet ./...

      - name: Build the AAR (govulncheck first; gomobile; armeabi-v7a, arm64-v8a, x86_64; 16 KB pages checked)
        id: aar
        if: ${{ !cancelled() && steps.modules.outcome == 'success' }}
        env:
          PF_GOVULNCHECK: "1"
        run: |
          set +e
          ./build-aar.sh > "$RUNNER_TEMP/build-aar.log" 2>&1
          status=$?
          cat "$RUNNER_TEMP/build-aar.log"
          if [ "$status" -ne 0 ]; then
            python3 ../scripts/ci_build_facts.py --log-tail "$RUNNER_TEMP/build-aar.log" build-aar.sh
            exit "$status"
          fi
          python3 ../scripts/ci_build_facts.py --engine-aar build/pfengine-facts.txt

      - name: Upload the AAR (for the build and device jobs)
        if: ${{ !cancelled() && steps.aar.outcome == 'success' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: pfengine-aar
          path: |
            engine/build/pfengine.aar
            engine/build/pfengine-facts.txt
          if-no-files-found: error

      - name: Tests with the race detector (adapters, mock proxies, netstack, lifecycle, leaks)
        if: ${{ !cancelled() }}
        run: |
          set +e
          go test -race -count=1 -json ./... > "$RUNNER_TEMP/go-test.json"
          status=$?
          python3 ../scripts/ci_build_facts.py --go-tests "$RUNNER_TEMP/go-test.json"
          exit $status

      - name: Fuzz every parser and the packet loop (30 s each)
        if: ${{ !cancelled() }}
        run: |
          for target in adapters:FuzzReadSOCKS5Reply adapters:FuzzReadConnectResponse adapters:FuzzParseCredentials \
                        adapters:FuzzConnectRequest fakedns:FuzzResponder tunnel:FuzzPacketLoop; do
            go test -run '^$' -fuzz "^${target#*:}\$" -fuzztime 30s "./${target%%:*}"
          done
