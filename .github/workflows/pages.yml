name: pages

# M11: the public privacy-policy page Google Play links to (docs/m11/declarations.md §3, owner decision D9), published
# with GitHub Pages from the app's own strings (scripts/release/privacy_page.py) — the same text the app shows and
# docs/m9/privacy-policy.md holds. The site is built on every push and pull request (the artifact can be checked), and
# deployed only from main (a push, or a hand-started run on main), once the owner has turned Pages on for the
# repository (Settings → Pages → Source: GitHub Actions) and set the repository variable PAGES_ENABLED to true; until
# then the deploy job is skipped, not failed. The page names the support address and the developer from the repository
# variables PROXYFLOW_SUPPORT_EMAIL and PROXYFLOW_DEVELOPER_NAME (decision D10). The page is static: no script, nothing
# fetched from anywhere. M12: the front page carries docs/m12/known-issue.md when it is not empty (the incident notice
# of docs/m12/incident-response.md §3), and — because this workflow runs on every push and pull request, with no path
# filter — the three M12 document checks run here too (the data-behaviour lock, the release readiness, the target
# API), so a docs-only commit (the privacy policy, the declarations, the changelog, the history) cannot drift past them
# while android.yml ignores docs/** and *.md. Third-party actions are pinned to commit SHAs (tag in the comment).

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: false # a deployment under way is never cut short

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: The privacy policy page and the front page, from the app's own strings
        env:
          PROXYFLOW_SUPPORT_EMAIL: ${{ vars.PROXYFLOW_SUPPORT_EMAIL }}
          PROXYFLOW_DEVELOPER_NAME: ${{ vars.PROXYFLOW_DEVELOPER_NAME }}
        run: |
          python3 scripts/release/privacy_page.py --out site --notice docs/m12/known-issue.md
          python3 -m unittest scripts.tests.test_privacy_page scripts.tests.test_privacy_policy
          grep -c '<h2>' site/privacy.html

      - name: The documents a release depends on (M12), on every push
        run: |
          python3 scripts/check_data_behavior.py
          python3 scripts/release/check_release_ready.py
          python3 scripts/check_target_api.py

      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: site

  deploy:
    needs: build
    if: ${{ github.event_name != 'pull_request' && github.ref == 'refs/heads/main' && vars.PAGES_ENABLED == 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
