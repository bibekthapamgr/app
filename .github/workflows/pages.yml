name: pages

# M11: the public privacy-policy page Google Play links to (docs/m11/declarations.md §3, owner decision D9), published
# with GitHub Pages from the app's own strings (scripts/release/privacy_page.py) — the same text the app shows and
# docs/m9/privacy-policy.md holds. The site is built on every push and pull request (the artifact can be checked), and
# deployed only from main, once the owner has turned Pages on for the repository (Settings → Pages → Source: GitHub
# Actions); until then the deploy job is skipped, not failed. The page is static: no script, nothing fetched from
# anywhere. Third-party actions are pinned to commit SHAs (tag in the comment).

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: The privacy policy page and the front page, from the app's own strings
        run: |
          python3 scripts/release/privacy_page.py --out site
          python3 -m unittest scripts.tests.test_privacy_page scripts.tests.test_privacy_policy
          grep -c '<h2>' site/privacy.html

      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: site

  deploy:
    needs: build
    if: ${{ github.event_name != 'pull_request' && vars.PAGES_ENABLED == 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
