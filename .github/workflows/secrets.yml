name: secrets

# Signing material and credentials must never reach the repository. Runs on
# every push and pull request whatever files changed (the Android build skips
# docs-only changes), and scans every commit as well as the current files, so a
# secret that was committed and deleted later still fails the check. Findings
# name the file and line, never the matched text.

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  scan:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # the history scan needs every commit
          persist-credentials: false

      - name: The rules catch their samples
        run: scripts/check-secrets.sh --self-test

      - name: Current files
        if: ${{ !cancelled() }}
        run: scripts/check-secrets.sh

      - name: Every commit in the history
        if: ${{ !cancelled() }}
        run: scripts/check-secrets.sh --history
